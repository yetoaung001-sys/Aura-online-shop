<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Padauk:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Plus Jakarta Sans', 'Padauk', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 pb-20">

  <!-- ADMIN BAR (SHOWN AFTER ADMIN LOGIN) -->
  <div id="adminBar" class="hidden bg-slate-900 text-amber-400 text-xs py-2.5 px-4 flex justify-between items-center shadow">
    <span class="font-bold">👑 Admin Mode (<span id="adminName">Admin</span>)</span>
    <div class="flex items-center gap-3">
      <button onclick="testTelegramAlert()" class="bg-sky-600 hover:bg-sky-500 text-white px-2.5 py-1 rounded font-bold flex items-center gap-1 transition">
        <i class="ph ph-telegram-logo text-sm"></i> Telegram စမ်းသပ်ပို့မည်
      </button>
      <button onclick="openAddModal()" class="bg-amber-500 hover:bg-amber-600 text-black px-2.5 py-1 rounded font-bold transition">
        + ပစ္စည်းတင်မည်
      </button>
      <button onclick="adminLogout()" class="underline text-rose-400 hover:text-rose-300">Logout</button>
    </div>
  </div>

  <!-- HEADER -->
  <header class="bg-white border-b px-4 h-16 flex items-center justify-between sticky top-0 z-30 shadow-sm">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 bg-indigo-600 text-white font-bold rounded-xl flex items-center justify-center">A</div>
      <div>
        <span class="font-bold text-base block leading-tight">Aura Shop</span>
        <span class="text-[10px] text-emerald-600 font-semibold">● Telegram Connected</span>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="openCart()" class="relative p-2 bg-slate-100 rounded-full hover:bg-slate-200 transition">
        <i class="ph ph-shopping-cart text-xl"></i>
        <span id="cartBadge" class="absolute -top-1 -right-1 bg-indigo-600 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
      </button>
    </div>
  </header>

  <!-- CONTENT -->
  <main class="max-w-4xl mx-auto p-4">
    <div class="flex justify-between items-center mb-3">
      <h2 class="font-bold text-slate-800 text-base">ပစ္စည်းစာရင်းများ</h2>
    </div>
    <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-3 sm:gap-4"></div>
  </main>

  <!-- CART MODAL -->
  <div id="cartModal" class="fixed inset-0 bg-black/50 z-40 hidden justify-end">
    <div class="bg-white w-full max-w-sm h-full flex flex-col p-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold">စျေးဝယ်တွန်းလှည်း</h3>
        <button onclick="closeCart()"><i class="ph ph-x text-lg"></i></button>
      </div>
      <div id="cartList" class="flex-1 overflow-y-auto divide-y py-2 text-xs"></div>
      <div class="border-t pt-3 space-y-2">
        <div class="flex justify-between font-bold text-sm">
          <span>စုစုပေါင်း:</span>
          <span id="cartTotal" class="text-indigo-600">0 MMK</span>
        </div>
        <button onclick="openCheckout()" class="w-full bg-indigo-600 text-white py-2 rounded-xl font-bold text-xs">Order တင်မည်</button>
      </div>
    </div>
  </div>

  <!-- CHECKOUT MODAL -->
  <div id="checkoutModal" class="fixed inset-0 bg-black/60 z-50 hidden items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl p-5 space-y-3 text-xs">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold">အော်ဒါ အချက်အလက်ဖြည့်ပါ</h3>
        <button onclick="closeCheckout()"><i class="ph ph-x text-lg"></i></button>
      </div>
      <form onsubmit="sendOrder(event)" class="space-y-2">
        <div>
          <label class="font-bold">ဝယ်သူအမည် *</label>
          <input type="text" id="cName" required class="w-full border p-2 rounded mt-1" placeholder="မောင်မောင်" />
        </div>
        <div>
          <label class="font-bold">ဖုန်းနံပါတ် *</label>
          <input type="tel" id="cPhone" required class="w-full border p-2 rounded mt-1" placeholder="09xxxxxxxxx" />
        </div>
        <div>
          <label class="font-bold">လိပ်စာ *</label>
          <textarea id="cAddress" required class="w-full border p-2 rounded mt-1" rows="2" placeholder="မြို့နယ်/လိပ်စာ..."></textarea>
        </div>
        <div>
          <label class="font-bold">ငွေချေနည်းလမ်း</label>
          <select id="cPayment" class="w-full border p-2 rounded mt-1 bg-white">
            <option value="KBZPay">KBZPay</option>
            <option value="WavePay">WavePay</option>
            <option value="Cash On Delivery">Cash On Delivery (အိမ်ရောက်ငွေချေ)</option>
          </select>
        </div>
        <button type="submit" id="sendBtn" class="w-full bg-indigo-600 text-white py-2 rounded-xl font-bold mt-2">အော်ဒါ အတည်ပြုမည်</button>
      </form>
    </div>
  </div>

  <!-- ADD PRODUCT MODAL -->
  <div id="addModal" class="fixed inset-0 bg-black/60 z-50 hidden items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl p-5 space-y-3 text-xs">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold">ပစ္စည်းအသစ် တင်ရန်</h3>
        <button onclick="closeAddModal()"><i class="ph ph-x text-lg"></i></button>
      </div>
      <form onsubmit="addProduct(event)" class="space-y-2">
        <div>
          <label class="font-bold">ပစ္စည်းအမည် *</label>
          <input type="text" id="pName" required class="w-full border p-2 rounded mt-1" placeholder="ဥပမာ - နာရီ" />
        </div>
        <div>
          <label class="font-bold">စျေးနှုန်း (MMK) *</label>
          <input type="number" id="pPrice" required class="w-full border p-2 rounded mt-1" placeholder="50000" />
        </div>
        <div>
          <label class="font-bold">ဓာတ်ပုံ Image Link (URL) *</label>
          <input type="url" id="pImg" required class="w-full border p-2 rounded mt-1" placeholder="https://..." />
        </div>
        <button type="submit" id="addBtn" class="w-full bg-emerald-600 text-white py-2 rounded-xl font-bold mt-2">သိမ်းဆည်းမည်</button>
      </form>
    </div>
  </div>

  <script>
    // သင့် Telegram Bot အချက်အလက်များ ချိတ်ဆက်ပြီးပါပြီ
    const TELEGRAM_CONFIG = {
      botToken: "8999186526:AAFS6cmrN-f0zZCo9ut6vJExT5xiGzRl8h4",
      chatId: "6759228843"
    };

    const initialProducts = [
      { id: 1, title: "Sony Wireless Headphone", priceMMK: 1250000, image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&q=80" },
      { id: 2, title: "Apple Watch Series", priceMMK: 850000, image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&q=80" },
      { id: 3, title: "Running Sneakers", priceMMK: 150000, image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500&q=80" }
    ];

    let products = JSON.parse(localStorage.getItem('aura_shop_products')) || initialProducts;
    let cart = [];
    let isAdmin = sessionStorage.getItem('is_admin') === 'true';

    function render() {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = products.map(p => `
        <div class="bg-white border rounded-xl p-3 flex flex-col justify-between relative shadow-sm">
          ${isAdmin ? `<button onclick="deleteProduct(${p.id})" class="absolute top-2 right-2 bg-rose-600 text-white p-1 rounded text-xs"><i class="ph ph-trash"></i></button>` : ''}
          <img src="${p.image}" class="w-full h-28 object-cover rounded-lg mb-2" onerror="this.src='https://via.placeholder.com/150'" />
          <div>
            <h4 class="font-bold text-xs line-clamp-1">${p.title}</h4>
            <div class="text-indigo-600 font-extrabold text-xs mt-1">${parseInt(p.priceMMK).toLocaleString()} MMK</div>
          </div>
          <button onclick="addToCart(${p.id})" class="mt-2 w-full bg-slate-900 text-white text-xs py-1.5 rounded-lg font-bold hover:bg-indigo-600 transition">Cart ထည့်မည်</button>
        </div>
      `).join('');
    }

    function addProduct(e) {
      e.preventDefault();
      const title = document.getElementById('pName').value.trim();
      const priceMMK = parseInt(document.getElementById('pPrice').value, 10);
      const image = document.getElementById('pImg').value.trim();

      products.unshift({ id: Date.now(), title, priceMMK, image });
      localStorage.setItem('aura_shop_products', JSON.stringify(products));
      render();
      closeAddModal();
      alert('✅ ပစ္စည်းအသစ် တင်ပြီးပါပြီ!');
    }

    function deleteProduct(id) {
      if (confirm('ဤပစ္စည်းကို ဖျက်မည်လား?')) {
        products = products.filter(p => p.id !== id);
        localStorage.setItem('aura_shop_products', JSON.stringify(products));
        render();
      }
    }

    function addToCart(id) {
      const item = products.find(p => p.id == id);
      if (!item) return;
      const exist = cart.find(c => c.id == id);
      if (exist) exist.qty += 1;
      else cart.push({ ...item, qty: 1 });
      updateCart();
      openCart();
    }

    function updateCart() {
      document.getElementById('cartBadge').innerText = cart.reduce((s, i) => s + i.qty, 0);
      const list = document.getElementById('cartList');
      const total = cart.reduce((s, i) => s + (parseInt(i.priceMMK) * i.qty), 0);
      document.getElementById('cartTotal').innerText = total.toLocaleString() + ' MMK';

      if (cart.length === 0) {
        list.innerHTML = `<div class="text-center py-8 text-slate-400">Cart ထဲတွင် ဘာမှမရှိပါ</div>`;
        return;
      }
      list.innerHTML = cart.map(i => `
        <div class="py-2 flex justify-between items-center">
          <div>
            <div class="font-bold">${i.title}</div>
            <div class="text-slate-500">${i.qty} x ${parseInt(i.priceMMK).toLocaleString()}</div>
          </div>
          <div class="font-bold">${(parseInt(i.priceMMK) * i.qty).toLocaleString()} MMK</div>
        </div>
      `).join('');
    }

    // TELEGRAM SEND ORDER
    async function sendOrder(e) {
      e.preventDefault();
      const name = document.getElementById('cName').value.trim();
      const phone = document.getElementById('cPhone').value.trim();
      const address = document.getElementById('cAddress').value.trim();
      const payment = document.getElementById('cPayment').value;
      const total = cart.reduce((s, i) => s + (parseInt(i.priceMMK) * i.qty), 0);

      let itemsText = "";
      cart.forEach((i, idx) => {
        itemsText += `${idx+1}. ${i.title} (${i.qty} ခု) = ${(parseInt(i.priceMMK) * i.qty).toLocaleString()} MMK\n`;
      });

      const message = `🛍️ အော်ဒါအသစ် ရောက်ရှိပါသည်!\n━━━━━━━━━━━━━\n👤 ဝယ်သူ: ${name}\n📞 ဖုန်း: ${phone}\n📍 လိပ်စာ: ${address}\n💳 ငွေပေးချေမှု: ${payment}\n\n📦 မှာယူသောပစ္စည်းများ:\n${itemsText}━━━━━━━━━━━━━\n💰 စုစုပေါင်းကျသင့်ငွေ: ${total.toLocaleString()} MMK`;

      const btn = document.getElementById('sendBtn');
      btn.innerText = "ပို့ဆောင်နေပါသည်...";
      btn.disabled = true;

      try {
        const res = await fetch(`https://api.telegram.org/bot${TELEGRAM_CONFIG.botToken}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: TELEGRAM_CONFIG.chatId, text: message })
        });
        const d = await res.json();
        if (d.ok) {
          alert(`🎉 ကျေးဇူးတင်ပါသည် ${name}!\nအော်ဒါကို အောင်မြင်စွာ လက်ခံရရှိပြီး Telegram သို့ စာပို့ဆောင်ပြီးပါပြီ။`);
        } else {
          alert('⚠️ Telegram သို့ စာမရောက်ပါ: ' + d.description + '\n(Bot ထဲတွင် /start နှိပ်ထားပါသလား စစ်ဆေးပါ)');
        }
      } catch (err) {
        alert('အော်ဒါလက်ခံရရှိပါသည်!');
      }

      cart = [];
      updateCart();
      closeCheckout();
      btn.innerText = "အော်ဒါ အတည်ပြုမည်";
      btn.disabled = false;
    }

    async function testTelegramAlert() {
      try {
        const res = await fetch(`https://api.telegram.org/bot${TELEGRAM_CONFIG.botToken}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: TELEGRAM_CONFIG.chatId, text: '🔔 Aura Shop စမ်းသပ်ချက်: Telegram ချိတ်ဆက်မှု ၁၀၀% အောင်မြင်ပါသည်!' })
        });
        const d = await res.json();
        if (d.ok) alert('✅ Telegram ထဲ စမ်းသပ်စာ ရောက်ရှိသွားပါပြီ!');
        else alert('❌ မအောင်မြင်ပါ: ' + d.description + '\n(Bot ကို /start နှိပ်ထားပါ)');
      } catch (e) {
        alert('Error: ' + e.message);
      }
    }

    // Admin Hash listener (#admin)
    window.addEventListener('hashchange', checkAdminHash);
    function checkAdminHash() {
      if (window.location.hash === '#admin') {
        const p = prompt('Admin Password: (Default: admin123)');
        if (p === 'admin123') {
          isAdmin = true;
          sessionStorage.setItem('is_admin', 'true');
          document.getElementById('adminBar').classList.remove('hidden');
          render();
        }
      }
    }

    function adminLogout() {
      isAdmin = false;
      sessionStorage.removeItem('is_admin');
      document.getElementById('adminBar').classList.add('hidden');
      window.location.hash = '';
      render();
    }

    function openCart() { document.getElementById('cartModal').classList.remove('hidden'); document.getElementById('cartModal').classList.add('flex'); }
    function closeCart() { document.getElementById('cartModal').classList.add('hidden'); document.getElementById('cartModal').classList.remove('flex'); }
    function openCheckout() { closeCart(); document.getElementById('checkoutModal').classList.remove('hidden'); document.getElementById('checkoutModal').classList.add('flex'); }
    function closeCheckout() { document.getElementById('checkoutModal').classList.add('hidden'); document.getElementById('checkoutModal').classList.remove('flex'); }
    function openAddModal() { document.getElementById('addModal').classList.remove('hidden'); document.getElementById('addModal').classList.add('flex'); }
    function closeAddModal() { document.getElementById('addModal').classList.add('hidden'); document.getElementById('addModal').classList.remove('flex'); }

    if (isAdmin) document.getElementById('adminBar').classList.remove('hidden');
    checkAdminHash();
    render();
  </script>
</body>
</html>
