<!DOCTYPE html>
<html lang="my" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura Marketplace - Myanmar's Shopee & Lazada Experience</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Padauk:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Plus Jakarta Sans', 'Padauk', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 pb-20">

  <!-- Top Ribbon -->
  <div class="bg-gradient-to-r from-orange-600 via-amber-600 to-rose-600 text-white text-[11px] py-1.5 px-4">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <span>⚡ အိမ်တိုင်ရာရောက် ငွေချေစနစ် (COD) ဖြင့် မြန်မာတစ်နိုင်ငံလုံးသို့ ပို့ဆောင်ပေးပါသည်</span>
      <div class="flex items-center gap-4">
        <a href="seller.html" class="font-bold underline hover:text-amber-200">Seller Center</a>
        <a href="admin.html#admin" class="hover:text-amber-200">👑 Admin</a>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2 cursor-pointer" onclick="location.reload()">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-orange-500 to-rose-500 text-white font-extrabold flex items-center justify-center text-xl shadow">
          <i class="ph-bold ph-shopping-bag"></i>
        </div>
        <div>
          <span class="font-extrabold text-xl leading-none block text-orange-600">Aura</span>
          <span class="text-[9px] text-slate-500 font-bold uppercase">Marketplace</span>
        </div>
      </div>

      <div class="flex-1 max-w-xl relative">
        <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="ပစ္စည်းများ ရှာဖွေရန်..." class="w-full pl-10 pr-4 py-2.5 bg-slate-100 border border-slate-200 rounded-2xl text-xs outline-none focus:ring-2 focus:ring-orange-500" />
        <i class="ph ph-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-base"></i>
      </div>

      <div class="flex items-center gap-3">
        <button onclick="openCart()" class="relative p-2.5 bg-orange-50 text-orange-600 rounded-2xl">
          <i class="ph-bold ph-shopping-cart-simple text-xl"></i>
          <span id="cartBadge" class="absolute -top-1.5 -right-1.5 bg-rose-600 text-white text-[9px] w-5 h-5 rounded-full flex items-center justify-center font-black scale-0">0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
    <div class="flex justify-between items-center border-b pb-2">
      <h2 class="font-extrabold text-slate-800 text-base">ကုန်ပစ္စည်းများအားလုံး</h2>
      <span id="productCountBadge" class="text-xs text-slate-400">Loading...</span>
    </div>

    <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
  </main>

  <!-- Cart Drawer -->
  <div id="cartModal" class="fixed inset-0 bg-black/60 z-50 hidden justify-end">
    <div class="bg-white w-full max-w-sm h-full flex flex-col p-4 shadow-2xl">
      <div class="flex justify-between items-center pb-3 border-b">
        <h3 class="font-bold text-sm">စျေးဝယ်တွန်းလှည်း</h3>
        <button onclick="closeCart()"><i class="ph ph-x text-xl"></i></button>
      </div>
      <div id="cartItems" class="flex-1 overflow-y-auto divide-y text-xs py-2"></div>
      <div class="border-t pt-3 space-y-2 text-xs">
        <div class="flex justify-between text-sm font-black">
          <span>စုစုပေါင်း:</span>
          <span id="cartTotal" class="text-orange-600">0 MMK</span>
        </div>
        <button onclick="openCheckout()" class="w-full bg-orange-600 text-white py-3 rounded-2xl font-bold shadow">Checkout ဝယ်ယူမည်</button>
      </div>
    </div>
  </div>

  <!-- Checkout Modal -->
  <div id="checkoutModal" class="fixed inset-0 bg-black/60 z-50 hidden items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-3xl p-6 space-y-3 text-xs shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-sm">အော်ဒါ အချက်အလက်</h3>
        <button onclick="closeCheckout()"><i class="ph ph-x text-lg"></i></button>
      </div>
      <form onsubmit="handleOrderSubmit(event)" class="space-y-3">
        <input type="text" id="custName" required placeholder="ဝယ်သူအမည် *" class="w-full border p-2.5 rounded-xl outline-none" />
        <input type="tel" id="custPhone" required placeholder="ဖုန်းနံပါတ် *" class="w-full border p-2.5 rounded-xl outline-none font-mono" />
        <input type="text" id="custTownship" required placeholder="မြို့နယ် *" class="w-full border p-2.5 rounded-xl outline-none" />
        <textarea id="custAddress" required placeholder="လိပ်စာ အပြည့်အစုံ *" class="w-full border p-2.5 rounded-xl outline-none" rows="2"></textarea>
        <select id="custPayment" class="w-full border p-2.5 rounded-xl bg-white font-bold">
          <option value="Cash On Delivery">Cash On Delivery (အိမ်ရောက်ငွေချေ)</option>
          <option value="KBZPay">KBZPay</option>
          <option value="WavePay">WavePay</option>
        </select>
        <div class="pt-2 border-t flex justify-between font-bold text-sm text-orange-600">
          <span>စုစုပေါင်း:</span>
          <span id="summaryTotal">0 MMK</span>
        </div>
        <button type="submit" id="submitOrderBtn" class="w-full bg-orange-600 text-white py-3 rounded-2xl font-bold shadow">အော်ဒါ အတည်ပြုမည်</button>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://zyajlsrytjvwxqtpxrqd.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5YWpsc3J5dGp2d3hxdHB4cnFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4Nzg1MjEsImV4cCI6MjEwNDQ1NDUyMX0.Tl_nrEQzt2wmCd9sZaLPr7Y5F97DKms9BCckZfI8WZ8";
    const client = supabase.createClient(SUPABASE_URL, SB_KEY);

    let products = [];
    let cart = [];
    let searchQuery = '';

    async function init() {
      const { data, error } = await client
        .from('products')
        .select('*, shops(name)')
        .order('id', { ascending: false });

      if (error) {
        console.error(error);
        alert("Error fetching products: " + error.message);
        return;
      }

      products = data || [];
      renderProducts();
    }

    function renderProducts() {
      const grid = document.getElementById('productGrid');
      let list = products;

      if (searchQuery) {
        list = list.filter(p => {
          const t = p.title || p.name || '';
          return t.toLowerCase().includes(searchQuery);
        });
      }

      document.getElementById('productCountBadge').innerText = `${list.length} မျိုး ရှိသည်`;

      if (!list.length) {
        grid.innerHTML = '<div class="col-span-full py-16 text-center text-slate-400 text-xs">ကုန်ပစ္စည်း မရှိသေးပါ</div>';
        return;
      }

      grid.innerHTML = list.map(p => {
        const title = p.title || p.name || 'အမည်မရှိပစ္စည်း';
        const price = Number(p.price || p.priceMMK || 0);
        const image = p.image || p.image_url || 'https://placehold.co/300';
        const shopName = p.shops?.name || 'Aura Store';

        return `
          <div class="bg-white rounded-2xl border border-slate-200 p-3 flex flex-col justify-between hover:shadow-md transition">
            <div>
              <div class="relative">
                <img src="${image}" class="w-full h-36 sm:h-44 object-cover rounded-xl mb-2" onerror="this.src='https://placehold.co/300'" />
                <span class="absolute bottom-2 left-2 bg-slate-900/80 backdrop-blur text-amber-300 text-[9px] font-bold px-2 py-0.5 rounded">
                  <i class="ph-fill ph-storefront"></i> ${shopName}
                </span>
              </div>
              <h4 class="font-bold text-xs text-slate-800 line-clamp-2">${title}</h4>
              <div class="text-base font-black text-orange-600 mt-1">${price.toLocaleString()} MMK</div>
              <div class="text-[10px] text-slate-400 mt-0.5">လက်ကျန်: ${p.stock || 0} ခု</div>
            </div>
            <button onclick="addToCart(${p.id}, '${title.replace(/'/g, "")}', ${price}, '${image}')" class="mt-3 w-full bg-orange-600 hover:bg-orange-700 text-white py-2 rounded-xl text-xs font-bold shadow transition">
              ဝယ်ယူမည်
            </button>
          </div>
        `;
      }).join('');
    }

    function handleSearch(val) {
      searchQuery = val.trim().toLowerCase();
      renderProducts();
    }

    function addToCart(id, title, price, image) {
      const exist = cart.find(i => i.id === id);
      if (exist) exist.qty += 1;
      else cart.push({ id, title, price, image, qty: 1 });
      updateCartUI();
      openCart();
    }

    function updateCartUI() {
      const totalQty = cart.reduce((s, i) => s + i.qty, 0);
      const badge = document.getElementById('cartBadge');
      badge.innerText = totalQty;
      badge.style.transform = totalQty > 0 ? 'scale(1)' : 'scale(0)';

      const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
      document.getElementById('cartTotal').innerText = total.toLocaleString() + ' MMK';

      const box = document.getElementById('cartItems');
      if (!cart.length) {
        box.innerHTML = '<div class="py-12 text-center text-slate-400">စျေးဝယ်တွန်းလှည်းထဲ ဘာမှမရှိသေးပါ</div>';
        return;
      }

      box.innerHTML = cart.map((i, idx) => `
        <div class="py-3 flex items-center justify-between gap-2">
          <img src="${i.image}" class="w-12 h-12 object-cover rounded-xl" />
          <div class="flex-1">
            <h5 class="font-bold line-clamp-1">${i.title}</h5>
            <div class="text-orange-600 font-bold">${i.price.toLocaleString()} MMK x ${i.qty}</div>
          </div>
          <button onclick="cart.splice(${idx}, 1); updateCartUI();" class="text-rose-500 p-1"><i class="ph ph-trash"></i></button>
        </div>
      `).join('');
    }

    function openCheckout() {
      if (!cart.length) return alert('စျေးဝယ်တွန်းလှည်းထဲ ပစ္စည်းမရှိပါ');
      closeCart();
      const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
      document.getElementById('summaryTotal').innerText = total.toLocaleString() + ' MMK';
      document.getElementById('checkoutModal').classList.remove('hidden');
      document.getElementById('checkoutModal').classList.add('flex');
    }

    async function handleOrderSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const township = document.getElementById('custTownship').value.trim();
      const address = document.getElementById('custAddress').value.trim();
      const payment = document.getElementById('custPayment').value;
      const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);

      const btn = document.getElementById('submitOrderBtn');
      btn.innerText = "တင်နေပါသည်...";
      btn.disabled = true;

      try {
        const { data: order, error } = await client.from('orders').insert([{
          customer_name: name, customer_phone: phone, township,
          delivery_address: address, payment_method: payment,
          total_amount: total, status: 'pending', order_status: 'pending'
        }]).select().single();

        if (error) throw error;

        alert('🎉 အော်ဒါတင်ခြင်း အောင်မြင်ပါသည်!');
        cart = [];
        updateCartUI();
        closeCheckout();
      } catch (err) {
        alert("❌ Error: " + err.message);
      } finally {
        btn.innerText = "အော်ဒါ အတည်ပြုမည်";
        btn.disabled = false;
      }
    }

    function openCart() { document.getElementById('cartModal').classList.remove('hidden'); document.getElementById('cartModal').classList.add('flex'); }
    function closeCart() { document.getElementById('cartModal').classList.add('hidden'); document.getElementById('cartModal').classList.remove('flex'); }
    function openCheckout() { document.getElementById('checkoutModal').classList.remove('hidden'); document.getElementById('checkoutModal').classList.add('flex'); }
    function closeCheckout() { document.getElementById('checkoutModal').classList.add('hidden'); document.getElementById('checkoutModal').classList.remove('flex'); }

    init();
  </script>
</body>
</html>
