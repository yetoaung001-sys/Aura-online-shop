<!DOCTYPE html>
<html lang="my" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura Store - Myanmar Premium E-Commerce</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Padauk:wght@400;700&display=swap" rel="stylesheet" />
  <style> body { font-family: 'Plus Jakarta Sans', 'Padauk', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-900 pb-20">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2 cursor-pointer" onclick="location.reload()">
        <div class="w-10 h-10 rounded-2xl bg-indigo-600 text-amber-400 font-extrabold flex items-center justify-center text-xl shadow">A</div>
        <div>
          <span class="font-extrabold text-lg leading-none block text-slate-900">Aura Store</span>
          <span class="text-[10px] text-emerald-600 font-bold">Online Marketplace</span>
        </div>
      </div>

      <div class="flex-1 max-w-md">
        <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="ပစ္စည်းအမည် ရှာဖွေပါ..." class="w-full px-4 py-2 bg-slate-100 border-none rounded-xl text-xs outline-none focus:ring-2 focus:ring-indigo-600" />
      </div>

      <div class="flex items-center gap-2">
        <button onclick="openCart()" class="relative p-2 bg-slate-100 text-slate-700 hover:text-indigo-600 rounded-full">
          <i class="ph ph-shopping-bag text-xl"></i>
          <span id="cartBadge" class="absolute -top-1 -right-1 bg-indigo-600 text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center font-bold scale-0">0</span>
        </button>
        <div id="authSection">
          <button onclick="openAuthModal()" class="text-xs font-bold text-indigo-600 border border-indigo-200 bg-indigo-50 px-3 py-1.5 rounded-full">အကောင့်ဝင်</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Product Catalog -->
  <main class="max-w-7xl mx-auto px-4 py-6">
    <div class="flex justify-between items-center mb-4">
      <h2 class="font-bold text-slate-800 text-base">ကုန်ပစ္စည်းများ</h2>
      <span id="itemCount" class="text-xs text-slate-400">Loading...</span>
    </div>
    <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
  </main>

  <!-- Cart Modal -->
  <div id="cartModal" class="fixed inset-0 bg-black/50 z-50 hidden justify-end">
    <div class="bg-white w-full max-w-sm h-full flex flex-col p-4 shadow-2xl">
      <div class="flex justify-between items-center pb-3 border-b">
        <h3 class="font-bold">စျေးဝယ်တွန်းလှည်း</h3>
        <button onclick="closeCart()"><i class="ph ph-x text-xl"></i></button>
      </div>
      <div id="cartItems" class="flex-1 overflow-y-auto divide-y py-2 text-xs"></div>
      <div class="border-t pt-3 space-y-2 text-xs">
        <div class="flex justify-between text-sm font-bold">
          <span>စုစုပေါင်း:</span>
          <span id="cartTotal" class="text-indigo-600">0 MMK</span>
        </div>
        <button onclick="openCheckout()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-2xl font-bold">Checkout ဝယ်ယူမည်</button>
      </div>
    </div>
  </div>

  <!-- Checkout Modal -->
  <div id="checkoutModal" class="fixed inset-0 bg-black/60 z-50 hidden items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-3xl p-6 space-y-3 text-xs shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-sm">အော်ဒါ အချက်အလက်</h3>
        <button onclick="closeCheckout()"><i class="ph ph-x text-lg"></i></button>
      </div>
      <form onsubmit="handleOrderSubmit(event)" class="space-y-3">
        <input type="text" id="custName" required placeholder="ဝယ်သူအမည် *" class="w-full border p-2 rounded-xl outline-none" />
        <input type="tel" id="custPhone" required placeholder="ဖုန်းနံပါတ် *" class="w-full border p-2 rounded-xl outline-none font-mono" />
        <input type="text" id="custTownship" required placeholder="မြို့နယ် *" class="w-full border p-2 rounded-xl outline-none" />
        <textarea id="custAddress" required placeholder="လိပ်စာ အပြည့်အစုံ *" class="w-full border p-2 rounded-xl outline-none" rows="2"></textarea>
        <select id="custPayment" class="w-full border p-2 rounded-xl bg-white font-bold">
          <option value="Cash On Delivery">Cash On Delivery (အိမ်ရောက်ငွေချေ)</option>
          <option value="KBZPay">KBZPay</option>
          <option value="WavePay">WavePay</option>
        </select>
        <div class="pt-2 border-t flex justify-between font-bold text-sm text-indigo-600">
          <span>စုစုပေါင်း:</span>
          <span id="summaryTotal">0 MMK</span>
        </div>
        <button type="submit" id="submitOrderBtn" class="w-full bg-indigo-600 text-white py-3 rounded-2xl font-bold">အော်ဒါ အတည်ပြုမည်</button>
      </form>
    </div>
  </div>

  <!-- Auth Modal -->
  <div id="authModal" class="fixed inset-0 bg-black/60 z-50 hidden items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl p-6 space-y-3 text-xs shadow-2xl">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 id="authTitle" class="font-bold text-sm">အကောင့်ဝင်ရန်</h3>
        <button onclick="closeAuthModal()"><i class="ph ph-x text-lg"></i></button>
      </div>
      <form onsubmit="handleAuth(event)" class="space-y-3">
        <input type="email" id="authEmail" required placeholder="Email *" class="w-full border p-2 rounded-xl outline-none" />
        <input type="password" id="authPass" required placeholder="Password *" class="w-full border p-2 rounded-xl outline-none" />
        <button type="submit" id="authBtn" class="w-full bg-indigo-600 text-white py-2.5 rounded-2xl font-bold">အတည်ပြုမည်</button>
        <div class="text-center pt-1">
          <button type="button" onclick="toggleAuth()" id="authToggleBtn" class="text-indigo-600 underline">အကောင့်သစ်ဖွင့်ပါ</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://zyajlsrytjvwxqtpxrqd.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5YWpsc3J5dGp2d3hxdHB4cnFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4Nzg1MjEsImV4cCI6MjEwNDQ1NDUyMX0.Tl_nrEQzt2wmCd9sZaLPr7Y5F97DKms9BCckZfI8WZ8";
    const client = supabase.createClient(SUPABASE_URL, SB_KEY);

    let products = [];
    let cart = [];
    let currentUser = null;
    let isRegister = false;

    async function init() {
      const { data } = await client.from('products').select('*').order('id', { ascending: false });
      products = data || [];
      renderProducts();

      client.auth.onAuthStateChange((_, session) => {
        currentUser = session?.user || null;
        updateAuthUI();
      });
    }

    function renderProducts(filterText = '') {
      const grid = document.getElementById('productGrid');
      let list = products;
      if (filterText) list = list.filter(p => (p.title || p.name || '').toLowerCase().includes(filterText.toLowerCase()));
      
      document.getElementById('itemCount').innerText = `${list.length} မျိုး`;
      if (!list.length) { grid.innerHTML = '<div class="col-span-full py-12 text-center text-slate-400 text-xs">ပစ္စည်းမရှိသေးပါ</div>'; return; }

      grid.innerHTML = list.map(p => `
        <div class="bg-white rounded-2xl border p-3 flex flex-col justify-between hover:shadow-md transition">
          <div>
            <img src="${p.image || p.image_url || 'https://placehold.co/200'}" class="w-full h-36 object-cover rounded-xl mb-2" />
            <h4 class="font-bold text-xs text-slate-800 line-clamp-1">${p.title || p.name}</h4>
            <div class="text-indigo-600 font-bold text-sm mt-1">${Number(p.price || p.priceMMK || 0).toLocaleString()} MMK</div>
          </div>
          <button onclick="addToCart(${p.id})" class="mt-3 w-full bg-slate-900 hover:bg-indigo-600 text-white py-2 rounded-xl text-xs font-bold transition">
            ဝယ်ယူမည်
          </button>
        </div>
      `).join('');
    }

    function handleSearch(val) { renderProducts(val.trim()); }

    function addToCart(id) {
      const p = products.find(i => i.id === id);
      if (!p) return;
      const exist = cart.find(i => i.id === id);
      if (exist) exist.qty += 1;
      else cart.push({ id: p.id, shop_id: p.shop_id || 1, title: p.title || p.name, price: Number(p.price || p.priceMMK || 0), image: p.image || p.image_url, qty: 1 });
      updateCartUI();
      openCart();
    }

    function updateCartUI() {
      const totalQty = cart.reduce((s, i) => s + i.qty, 0);
      const badge = document.getElementById('cartBadge');
      badge.innerText = totalQty;
      badge.style.transform = totalQty > 0 ? 'scale(1)' : 'scale(0)';
      
      const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
      document.getElementById('cartTotal').innerText = total.toLocaleString() + ' MMK';

      const box = document.getElementById('cartItems');
      if (!cart.length) { box.innerHTML = '<div class="py-12 text-center text-slate-400">တွန်းလှည်းထဲ ဘာမှမရှိပါ</div>'; return; }

      box.innerHTML = cart.map((i, idx) => `
        <div class="py-2.5 flex items-center justify-between gap-2">
          <img src="${i.image}" class="w-10 h-10 object-cover rounded-lg" />
          <div class="flex-1">
            <h5 class="font-bold line-clamp-1">${i.title}</h5>
            <div class="text-indigo-600 font-bold">${i.price.toLocaleString()} MMK x ${i.qty}</div>
          </div>
          <button onclick="cart.splice(${idx},1); updateCartUI();" class="text-rose-500"><i class="ph ph-trash"></i></button>
        </div>
      `).join('');
    }

    function openCheckout() {
      if (!cart.length) return alert('တွန်းလှည်းထဲ ပစ္စည်းမရှိပါ');
      closeCart();
      const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
      document.getElementById('summaryTotal').innerText = total.toLocaleString() + ' MMK';
      document.getElementById('checkoutModal').classList.remove('hidden');
      document.getElementById('checkoutModal').classList.add('flex');
    }

    async function handleOrderSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const township = document.getElementById('custTownship').value.trim();
      const address = document.getElementById('custAddress').value.trim();
      const payment = document.getElementById('custPayment').value;
      const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);

      const btn = document.getElementById('submitOrderBtn');
      btn.innerText = "တင်နေပါသည်...";
      btn.disabled = true;

      try {
        const { data: order, error } = await client.from('orders').insert([{
          customer_uid: currentUser ? currentUser.id : null,
          customer_name: name, customer_phone: phone, township,
          delivery_address: address, payment_method: payment,
          total_amount: total, status: 'pending', order_status: 'pending'
        }]).select().single();

        if (error) throw error;

        // Multi-vendor split
        const byShop = cart.reduce((acc, item) => {
          acc[item.shop_id] = acc[item.shop_id] || [];
          acc[item.shop_id].push(item);
          return acc;
        }, {});

        for (const sId in byShop) {
          const items = byShop[sId];
          const subtotal = items.reduce((s, i) => s + (i.price * i.qty), 0);
          const comm = Math.round(subtotal * 0.05);
          await client.from('shop_orders').insert([{
            order_id: order.id, shop_id: parseInt(sId, 10),
            items, subtotal, platform_commission: comm, commission_amount: comm,
            seller_payout: subtotal - comm, status: 'pending', payout_status: 'unpaid'
          }]);
        }

        alert(`🎉 အော်ဒါအောင်မြင်စွာ တင်ပြီးပါပြီ!`);
        cart = [];
        updateCartUI();
        closeCheckout();
      } catch (err) {
        alert("❌ Error: " + err.message);
      } finally {
        btn.innerText = "အော်ဒါ အတည်ပြုမည်";
        btn.disabled = false;
      }
    }

    function updateAuthUI() {
      const box = document.getElementById('authSection');
      if (currentUser) {
        box.innerHTML = `<button onclick="client.auth.signOut()" class="text-xs text-rose-500 font-bold">ထွက်မည်</button>`;
      } else {
        box.innerHTML = `<button onclick="openAuthModal()" class="text-xs font-bold text-indigo-600 border border-indigo-200 bg-indigo-50 px-3 py-1.5 rounded-full">အကောင့်ဝင်</button>`;
      }
    }

    async function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPass').value;
      const { error } = isRegister ? 
        await client.auth.signUp({ email, password }) : 
        await client.auth.signInWithPassword({ email, password });
      
      if (error) alert("❌ " + error.message);
      else { alert("🎉 အောင်မြင်ပါသည်!"); closeAuthModal(); }
    }

    function toggleAuth() {
      isRegister = !isRegister;
      document.getElementById('authTitle').innerText = isRegister ? 'အကောင့်သစ်ဖွင့်ရန်' : 'အကောင့်ဝင်ရန်';
      document.getElementById('authToggleBtn').innerText = isRegister ? 'Login ပြန်ဝင်ပါ' : 'အကောင့်သစ်ဖွင့်ပါ';
    }

    function openCart() { document.getElementById('cartModal').classList.remove('hidden'); document.getElementById('cartModal').classList.add('flex'); }
    function closeCart() { document.getElementById('cartModal').classList.add('hidden'); document.getElementById('cartModal').classList.remove('flex'); }
    function closeCheckout() { document.getElementById('checkoutModal').classList.add('hidden'); document.getElementById('checkoutModal').classList.remove('flex'); }
    function openAuthModal() { document.getElementById('authModal').classList.remove('hidden'); document.getElementById('authModal').classList.add('flex'); }
    function closeAuthModal() { document.getElementById('authModal').classList.add('hidden'); document.getElementById('authModal').classList.remove('flex'); }

    init();
  </script>
</body>
</html>
