<!DOCTYPE html>
<html lang="my" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura Store - Myanmar Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Padauk:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Plus Jakarta Sans', 'Padauk', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 pb-20">

  <!-- TOP BAR -->
  <div id="adminBar" class="hidden bg-amber-500 text-slate-950 text-xs py-2 px-4 font-bold flex justify-between items-center">
    <span>👑 Admin Mode ဖွင့်ထားပါသည်</span>
    <div class="space-x-2">
      <button onclick="openAddModal()" class="bg-black text-white px-3 py-1 rounded">+ ပစ္စည်းအသစ်တင်မည်</button>
      <button onclick="logoutAdmin()" class="underline">Logout</button>
    </div>
  </div>

  <header class="sticky top-0 z-40 bg-white border-b border-slate-200 px-4 h-16 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 bg-indigo-600 text-white font-bold rounded-xl flex items-center justify-center text-lg">A</div>
      <span class="font-bold text-lg">Aura Shop</span>
    </div>

    <div class="flex items-center gap-3">
      <button onclick="handleAdminLogin()" id="adminBtn" class="p-2 text-slate-600 hover:bg-slate-100 rounded-full" title="Admin Login">
        <i class="ph ph-lock-key text-xl"></i>
      </button>

      <button onclick="openTelegramSetup()" class="p-2 text-slate-600 hover:bg-slate-100 rounded-full" title="Telegram Settings">
        <i class="ph ph-telegram-logo text-xl text-sky-500"></i>
      </button>

      <button onclick="openCart()" class="relative p-2 text-slate-700 bg-slate-100 rounded-full">
        <i class="ph ph-shopping-cart text-xl"></i>
        <span id="cartCount" class="absolute -top-1 -right-1 bg-indigo-600 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span>
      </button>
    </div>
  </header>

  <!-- PRODUCTS GRID -->
  <main class="max-w-6xl mx-auto px-4 py-6">
    <div class="flex justify-between items-center mb-4">
      <h2 class="font-bold text-slate-800 text-lg">ပစ္စည်းစာရင်းများ</h2>
      <button id="addBtnQuick" onclick="openAddModal()" class="hidden bg-emerald-600 text-white text-xs px-3 py-2 rounded-lg font-bold">
        + ပစ္စည်းအသစ်တင်ရန်
      </button>
    </div>
    <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></div>
  </main>

  <!-- CART MODAL -->
  <div id="cartModal" class="fixed inset-0 bg-black/50 z-50 hidden justify-end">
    <div class="bg-white w-full max-w-sm h-full flex flex-col p-4">
      <div class="flex justify-between items-center pb-3 border-b">
        <h3 class="font-bold">စျေးဝယ်တွန်းလှည်း</h3>
        <button onclick="closeCart()"><i class="ph ph-x text-xl"></i></button>
      </div>
      <div id="cartItems" class="flex-1 overflow-y-auto divide-y py-2"></div>
      <div class="border-t pt-3 space-y-2">
        <div class="flex justify-between text-sm font-bold">
          <span>စုစုပေါင်းငွေ:</span>
          <span id="cartTotal" class="text-indigo-600">0 MMK</span>
        </div>
        <button onclick="openCheckout()" class="w-full bg-indigo-600 text-white py-2.5 rounded-xl font-bold">Order တင်မည်</button>
      </div>
    </div>
  </div>

  <!-- CHECKOUT MODAL -->
  <div id="checkoutModal" class="fixed inset-0 bg-black/60 z-50 hidden items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl p-5 space-y-3">
      <div class="flex justify-between items-center pb-2 border-b">
        <h3 class="font-bold">Order တင်ရန် အချက်အလက်ဖြည့်ပါ</h3>
        <button onclick="closeCheckout()"><i class="ph ph-x text-lg"></i></button>
      </div>
      <form onsubmit="sendOrder(event)" class="space-y-3 text-xs">
        <div>
          <label class="font-bold">ဝယ်သူအမည် *</label>
          <input type="text" id="custName" required placeholder="ဦးဘ" class="w-full border p-2 rounded mt-1" />
        </div>
        <div>
          <label class="font-bold">ဖုန်းနံပါတ် *</label>
          <input type="tel" id="custPhone" required placeholder="09xxxxxxxxx" class="w-full border p-2 rounded mt-1" />
        </div>
        <div>
          <label class="font-bold">လိပ်စာ အပြည့်အစုံ *</label>
          <textarea id="custAddress" required placeholder="အမှတ်၊ လမ်း၊ မြို့နယ်..." class="w-full border p-2 rounded mt-1" rows="2"></textarea>
        </div>
        <div>
          <label class="font-bold">ငွေပေးချေမှုပုံစံ</label>
          <select id="custPayment" class="w-full border p-2 rounded mt-1 bg-white">
            <option value="KBZPay">KBZPay</option>
            <option value="WavePay">WavePay</option>
            <option value="Cash On Delivery">Cash On Delivery (အိမ်ရောက်ငွေချေ)</option>
          </select>
        </div>
        <button type="submit" id="sendBtn" class="w-full bg-indigo-600 text-white py-2.5 rounded-xl font-bold text-sm">
          အော်ဒါ အတည်ပြုပေးပို့မည်
        </button>
      </form>
    </div>
  </div>

  <!-- ADD PRODUCT MODAL -->
  <div id="addModal" class="fixed inset-0 bg-black/60 z-50 hidden items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl p-5 space-y-3 text-xs">
      <div class="flex justify-between items-center pb-2 border-b">
        <h3 class="font-bold text-sm">ပစ္စည်းအသစ် တင်ရန်</h3>
        <button onclick="closeAddModal()"><i class="ph ph-x text-lg"></i></button>
      </div>
      <form onsubmit="saveProduct(event)" class="space-y-3">
        <div>
          <label class="font-bold">ပစ္စည်းအမည် *</label>
          <input type="text" id="pName" required placeholder="ဥပမာ - နာရီ" class="w-full border p-2 rounded mt-1" />
        </div>
        <div>
          <label class="font-bold">စျေးနှုန်း (MMK) *</label>
          <input type="number" id="pPrice" required placeholder="50000" class="w-full border p-2 rounded mt-1" />
        </div>
        <div>
          <label class="font-bold">ဓာတ်ပုံ Image Link (URL) *</label>
          <input type="url" id="pImg" required placeholder="https://..." class="w-full border p-2 rounded mt-1" />
          <p class="text-[10px] text-slate-400 mt-1">သတိပြုရန်: ပုံကြီးများကြောင့် မပျက်စီးစေရန် Image Link သာ ထည့်ပေးပါ (ဥပမာ Postimages.org သို့မဟုတ် Google Image Link)</p>
        </div>
        <button type="submit" class="w-full bg-emerald-600 text-white py-2.5 rounded-xl font-bold">သိမ်းဆည်းမည်</button>
      </form>
    </div>
  </div>

  <!-- TELEGRAM SETUP MODAL -->
  <div id="teleModal" class="fixed inset-0 bg-black/60 z-50 hidden items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl p-5 space-y-3 text-xs">
      <div class="flex justify-between items-center pb-2 border-b">
        <h3 class="font-bold text-sm">Telegram Bot ချိတ်ဆက်ရန်</h3>
        <button onclick="closeTelegramSetup()"><i class="ph ph-x text-lg"></i></button>
      </div>
      <div class="space-y-2">
        <div>
          <label class="font-bold">Bot Token</label>
          <input type="text" id="tToken" class="w-full border p-2 rounded mt-1 font-mono text-[11px]" placeholder="123456:ABC-DEF..." />
        </div>
        <div>
          <label class="font-bold">Chat ID</label>
          <input type="text" id="tChat" class="w-full border p-2 rounded mt-1 font-mono text-[11px]" placeholder="987654321" />
        </div>
      </div>
      <div class="flex gap-2 pt-2">
        <button onclick="saveTelegramKeys()" class="flex-1 bg-indigo-600 text-white py-2 rounded-lg font-bold">Save</button>
        <button onclick="testTelegramAlert()" class="px-3 bg-slate-200 py-2 rounded-lg font-bold">စမ်းသပ်ပို့မည်</button>
      </div>
    </div>
  </div>

  <script>
    // 👇 သင့် Bot Token နှင့် Chat ID ကို ဒီနေရာတွင်လည်း တိုက်ရိုက်ထည့်ထားနိုင်ပါသည်
    const CONFIG = {
      defaultBotToken: "7829471923:AAExampleTokenPlaceholder", // 👈 သင့် Token ထည့်ပါ
      defaultChatId: "123456789"                               // 👈 သင့် Chat ID ထည့်ပါ
    };

    const initialProducts = [
      { id: 1, title: "Sony Wireless Headphone", priceMMK: 1250000, image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&q=80" },
      { id: 2, title: "Apple Watch Series", priceMMK: 850000, image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&q=80" },
      { id: 3, title: "Running Sneakers", priceMMK: 150000, image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500&q=80" }
    ];

    let products = JSON.parse(localStorage.getItem('my_shop_products')) || initialProducts;
    let cart = [];
    let isAdmin = sessionStorage.getItem('shop_admin') === 'true';

    function renderProducts() {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = products.map(p => `
        <div class="bg-white rounded-xl border p-3 flex flex-col justify-between relative">
          ${isAdmin ? `<button onclick="deleteProduct(${p.id})" class="absolute top-2 right-2 bg-red-600 text-white p-1.5 rounded-lg text-xs font-bold"><i class="ph ph-trash"></i></button>` : ''}
          <img src="${p.image}" class="w-full h-32 object-cover rounded-lg mb-2" onerror="this.src='https://via.placeholder.com/150'" />
          <div>
            <h4 class="font-bold text-xs line-clamp-1">${p.title}</h4>
            <div class="text-sm font-extrabold text-indigo-600 mt-1">${p.priceMMK.toLocaleString()} MMK</div>
          </div>
          <button onclick="addToCart(${p.id})" class="mt-2 w-full bg-slate-900 hover:bg-indigo-600 text-white text-xs py-2 rounded-lg font-bold transition">
            Cart ထည့်မည်
          </button>
        </div>
      `).join('');
    }

    function saveProduct(e) {
      e.preventDefault();
      const title = document.getElementById('pName').value.trim();
      const priceMMK = parseInt(document.getElementById('pPrice').value, 10);
      const image = document.getElementById('pImg').value.trim();

      const newP = { id: Date.now(), title, priceMMK, image };
      products.unshift(newP);
      localStorage.setItem('my_shop_products', JSON.stringify(products));
      renderProducts();
      closeAddModal();
      document.getElementById('pName').value = '';
      document.getElementById('pPrice').value = '';
      document.getElementById('pImg').value = '';
      alert('✅ ပစ္စည်းအသစ် တင်ပြီးပါပြီ!');
    }

    function deleteProduct(id) {
      if (confirm('ဖျက်ရန် သေချာပါသလား?')) {
        products = products.filter(p => p.id !== id);
        localStorage.setItem('my_shop_products', JSON.stringify(products));
        renderProducts();
      }
    }

    function addToCart(id) {
      const item = products.find(p => p.id === id);
      const exist = cart.find(c => c.id === id);
      if (exist) exist.qty += 1;
      else cart.push({ ...item, qty: 1 });
      updateCart();
      openCart();
    }

    function updateCart() {
      document.getElementById('cartCount').innerText = cart.reduce((s, i) => s + i.qty, 0);
      const container = document.getElementById('cartItems');
      const total = cart.reduce((s, i) => s + (i.priceMMK * i.qty), 0);
      document.getElementById('cartTotal').innerText = total.toLocaleString() + ' MMK';

      if (cart.length === 0) {
        container.innerHTML = `<div class="py-10 text-center text-slate-400 text-xs">စျေးဝယ်တွန်းလှည်းထဲ ဘာမှမရှိပါ</div>`;
        return;
      }
      container.innerHTML = cart.map(i => `
        <div class="py-2 flex justify-between items-center text-xs">
          <div>
            <div class="font-bold">${i.title}</div>
            <div class="text-slate-500">${i.qty} x ${i.priceMMK.toLocaleString()}</div>
          </div>
          <div class="font-bold">${(i.priceMMK * i.qty).toLocaleString()} MMK</div>
        </div>
      `).join('');
    }

    async function sendOrder(e) {
      e.preventDefault();
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const address = document.getElementById('custAddress').value.trim();
      const payment = document.getElementById('custPayment').value;
      const total = cart.reduce((s, i) => s + (i.priceMMK * i.qty), 0);

      const botToken = localStorage.getItem('t_token') || CONFIG.defaultBotToken;
      const chatId = localStorage.getItem('t_chat') || CONFIG.defaultChatId;

      let itemsText = "";
      cart.forEach((i, idx) => {
        itemsText += `${idx+1}. ${i.title} (${i.qty} ခု) = ${(i.priceMMK * i.qty).toLocaleString()} MMK\n`;
      });

      const message = `🛍️ အော်ဒါအသစ်ရောက်ပါပြီ!\n━━━━━━━━━━━━━\n👤 ဝယ်သူ: ${name}\n📞 ဖုန်း: ${phone}\n📍 လိပ်စာ: ${address}\n💳 ငွေချေစနစ်: ${payment}\n\n📦 မှာယူသောပစ္စည်းများ:\n${itemsText}━━━━━━━━━━━━━\n💰 စုစုပေါင်း: ${total.toLocaleString()} MMK`;

      const btn = document.getElementById('sendBtn');
      btn.innerText = "ပို့ဆောင်နေပါသည်...";
      btn.disabled = true;

      try {
        const res = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: chatId, text: message })
        });
        const d = await res.json();
        if (d.ok) {
          alert('🎉 အော်ဒါအောင်မြင်ပါသည်! Telegram သို့ စာရောက်ရှိသွားပါပြီ။');
          cart = [];
          updateCart();
          closeCheckout();
        } else {
          alert('⚠️ Telegram သို့ မရောက်ပါ: ' + d.description + '\n(Bot ထဲတွင် /start နှိပ်ထားပါသလား သို့မဟုတ် Token/Chat ID မှားနေပါသလား စစ်ဆေးပေးပါ)');
        }
      } catch (err) {
        alert('အင်တာနက် error ဖြစ်နေပါသည်: ' + err.message);
      } finally {
        btn.innerText = "အော်ဒါ အတည်ပြုပေးပို့မည်";
        btn.disabled = false;
      }
    }

    // Modal controls
    function openCart() { document.getElementById('cartModal').classList.remove('hidden'); document.getElementById('cartModal').classList.add('flex'); }
    function closeCart() { document.getElementById('cartModal').classList.add('hidden'); document.getElementById('cartModal').classList.remove('flex'); }
    function openCheckout() { closeCart(); document.getElementById('checkoutModal').classList.remove('hidden'); document.getElementById('checkoutModal').classList.add('flex'); }
    function closeCheckout() { document.getElementById('checkoutModal').classList.add('hidden'); document.getElementById('checkoutModal').classList.remove('flex'); }
    function openAddModal() { document.getElementById('addModal').classList.remove('hidden'); document.getElementById('addModal').classList.add('flex'); }
    function closeAddModal() { document.getElementById('addModal').classList.add('hidden'); document.getElementById('addModal').classList.remove('flex'); }
    
    function openTelegramSetup() {
      document.getElementById('tToken').value = localStorage.getItem('t_token') || '';
      document.getElementById('tChat').value = localStorage.getItem('t_chat') || '';
      document.getElementById('teleModal').classList.remove('hidden');
      document.getElementById('teleModal').classList.add('flex');
    }
    function closeTelegramSetup() { document.getElementById('teleModal').classList.add('hidden'); document.getElementById('teleModal').classList.remove('flex'); }
    function saveTelegramKeys() {
      localStorage.setItem('t_token', document.getElementById('tToken').value.trim());
      localStorage.setItem('t_chat', document.getElementById('tChat').value.trim());
      alert('Telegram Keys သိမ်းဆည်းပြီးပါပြီ!');
      closeTelegramSetup();
    }

    async function testTelegramAlert() {
      const token = document.getElementById('tToken').value.trim() || localStorage.getItem('t_token') || CONFIG.defaultBotToken;
      const chat = document.getElementById('tChat').value.trim() || localStorage.getItem('t_chat') || CONFIG.defaultChatId;
      try {
        const r = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ chat_id: chat, text: '🔔 Aura Shop Test Message: ချိတ်ဆက်မှု အောင်မြင်ပါသည်!' })
        });
        const data = await r.json();
        if(data.ok) alert('✅ Telegram ထဲ စာရောက်ပါပြီ!');
        else alert('❌ မအောင်မြင်ပါ: ' + data.description);
      } catch(e) {
        alert('Error: ' + e.message);
      }
    }

    function handleAdminLogin() {
      if (isAdmin) {
        if(confirm('Logout လုပ်မလား?')) logoutAdmin();
      } else {
        const p = prompt('Admin Password ရိုက်ပါ (Default: admin123)');
        if (p === 'admin123') {
          isAdmin = true;
          sessionStorage.setItem('shop_admin', 'true');
          updateAdminUI();
          alert('Admin Login အောင်မြင်ပါသည်!');
        } else if(p) {
          alert('Password မှားပါသည်!');
        }
      }
    }

    function logoutAdmin() {
      isAdmin = false;
      sessionStorage.removeItem('shop_admin');
      updateAdminUI();
    }

    function updateAdminUI() {
      if (isAdmin) {
        document.getElementById('adminBar').classList.remove('hidden');
        document.getElementById('addBtnQuick').classList.remove('hidden');
      } else {
        document.getElementById('adminBar').classList.add('hidden');
        document.getElementById('addBtnQuick').classList.add('hidden');
      }
      renderProducts();
    }

    renderProducts();
    updateAdminUI();
  </script>
</body>
</html>
