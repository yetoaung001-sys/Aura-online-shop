<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura Marketplace - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Padauk:wght@400;700&display=swap" rel="stylesheet" />
  <style>body { font-family: 'Plus Jakarta Sans', 'Padauk', sans-serif; background-color: #f8fafc; }</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white w-full max-w-md rounded-3xl p-8 shadow-xl border space-y-6">
    <div class="text-center space-y-1">
      <h1 class="text-2xl font-black text-slate-900">AURA MARKET</h1>
      <p class="text-xs text-slate-500 font-medium">ဆိုင်ရှင် သို့မဟုတ် Admin အကောင့်ဝင်ရောက်ပါ</p>
    </div>

    <form onsubmit="handleLogin(event)" class="space-y-4 text-xs">
      <div>
        <label for="email" class="font-bold block mb-1.5 text-slate-700">Email လိပ်စာ</label>
        <input type="email" id="email" required placeholder="admin@aura.com" class="w-full border p-3 rounded-2xl bg-slate-50 outline-none" />
      </div>
      <div>
        <label for="password" class="font-bold block mb-1.5 text-slate-700">စကားဝှက်</label>
        <input type="password" id="password" required placeholder="••••••••" class="w-full border p-3 rounded-2xl bg-slate-50 outline-none" />
      </div>
      <button type="submit" id="loginBtn" class="w-full bg-violet-600 hover:bg-violet-700 text-white font-bold py-3.5 rounded-2xl shadow-lg transition cursor-pointer">
        အကောင့်ဝင်မည်
      </button>
    </form>
    <div class="text-center">
      <a href="index.html" class="text-xs font-bold text-violet-600 hover:underline">← ပင်မ စျေးဝယ်စာမျက်နှာသို့ ပြန်သွားမည်</a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = window.location.origin + '/api/supabase';
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5YWpsc3J5dGp2d3hxdHB4cnFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4Nzg1MjEsImV4cCI6MjEwNDQ1NDUyMX0.Tl_nrEQzt2wmCd9sZaLPr7Y5F97DKms9BCckZfI8WZ8";
    const client = supabase.createClient(SUPABASE_URL, SB_KEY);

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.innerText = "စစ်ဆေးနေပါသည်..."; btn.disabled = true;

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      try {
        const { data, error } = await client.auth.signInWithPassword({ email, password });
        if (error) throw error;

        const { data: profile } = await client.from('profiles').select('role').eq('id', data.user.id).maybeSingle();
        if (profile?.role === 'admin' || profile?.role === 'super_admin') {
          location.href = 'admin.html';
        } else if (profile?.role === 'seller') {
          location.href = 'seller.html';
        } else {
          location.href = 'index.html';
        }
      } catch (err) {
        Swal.fire({ icon: 'error', title: 'အကောင့်ဝင်မရပါ', text: err.message });
      } finally {
        btn.innerText = "အကောင့်ဝင်မည်"; btn.disabled = false;
      }
    }
  </script>
</body>
</html>
