<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura Platform - Seller Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', 'Padauk', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen pb-12">

  <header class="bg-slate-900 text-white sticky top-0 z-40 shadow">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <span class="bg-violet-600 text-white text-xs px-2.5 py-1 rounded font-bold uppercase">Seller Center</span>
        <h1 class="text-lg sm:text-xl font-bold tracking-tight" id="sellerShopName">Aura Store</h1>
      </div>
      <button type="button" onclick="sellerLogout()" class="text-xs bg-rose-600 hover:bg-rose-700 px-3 py-1.5 rounded transition font-bold">
        <i class="fa-solid fa-right-from-bracket mr-1"></i> ထွက်မည်
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
    <!-- ANALYTICS -->
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
      <div class="bg-white p-4 rounded-2xl border shadow-sm"><span class="text-slate-400 text-xs font-bold">စုစုပေါင်း ရောင်းရငွေ</span><div id="statTotalSales" class="text-xl font-black text-slate-900 mt-1">0 Ks</div></div>
      <div class="bg-white p-4 rounded-2xl border shadow-sm"><span class="text-slate-400 text-xs font-bold">သင့်ရငွေ (Net Payout)</span><div id="statNetPayout" class="text-xl font-black text-emerald-600 mt-1">0 Ks</div></div>
      <div class="bg-white p-4 rounded-2xl border shadow-sm"><span class="text-slate-400 text-xs font-bold">Package အော်ဒါ</span><div id="statTotalOrders" class="text-xl font-black text-violet-600 mt-1">0 ခု</div></div>
    </div>

    <!-- ORDERS TABLE -->
    <div class="bg-white rounded-2xl border shadow-sm p-4 overflow-x-auto text-xs">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-extrabold text-sm text-slate-800">🛒 သင့်ဆိုင်ထံသို့ ကျရောက်လာသော Package အော်ဒါများ</h3>
        <span class="inline-flex items-center gap-1.5 bg-emerald-50 text-emerald-600 font-bold px-3 py-1 rounded-full text-[10px]">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span> Realtime Active
        </span>
      </div>
      <table class="w-full text-left">
        <thead>
          <tr class="border-b text-slate-400 text-[11px]">
            <th class="py-2.5">Package ID</th>
            <th>ဝယ်သူ / လိပ်စာ</th>
            <th>မှာယူထားသော ပစ္စည်းများ</th>
            <th>သင့်ရငွေ (Net)</th>
            <th>Payout အခြေအနေ</th>
            <th>လုပ်ဆောင်ချက်</th>
          </tr>
        </thead>
        <tbody id="sellerOrdersTable" class="divide-y"><tr><td colspan="6" class="py-8 text-center text-slate-400">ရှာဖွေနေပါသည်...</td></tr></tbody>
      </table>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://zyajlsrytjvwxqtpxrqd.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5YWpsc3J5dGp2d3hxdHB4cnFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4Nzg1MjEsImV4cCI6MjEwNDQ1NDUyMX0.Tl_nrEQzt2wmCd9sZaLPr7Y5F97DKms9BCckZfI8WZ8";
    const client = supabase.createClient(SUPABASE_URL, SB_KEY);

    let myShop = null;

    async function initSeller() {
      const { data: { session } } = await client.auth.getSession();
      if (!session) return location.href = 'index.html';

      const { data: shop } = await client.from('shops').select('*').eq('owner_id', session.user.id).maybeSingle();
      if (!shop) {
        Swal.fire({ icon: 'error', title: 'ဆိုင်မရှိပါ', text: 'သင့်အကောင့်တွင် ဆိုင်ဖွင့်ထားခြင်း မရှိသေးပါ' });
        return;
      }

      myShop = shop;
      document.getElementById('sellerShopName').innerText = shop.name;
      await loadShopOrders();
      initRealtimeSubscription();
    }

    async function loadShopOrders() {
      const { data: orders } = await client.from('orders').select('*').eq('shop_id', myShop.id).order('id', { ascending: false });
      const tbody = document.getElementById('sellerOrdersTable');

      if (!orders || !orders.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="py-8 text-center text-slate-400">အော်ဒါ မရှိသေးပါ</td></tr>';
        return;
      }

      let totalSales = 0, totalPayout = 0;
      tbody.innerHTML = orders.map(o => {
        totalSales += Number(o.subtotal || 0);
        totalPayout += Number(o.seller_payout || 0);

        const itemsStr = (o.items || []).map(i => `${i.title} (${i.qty}ခု)`).join(', ');
        return `
          <tr class="hover:bg-slate-50 border-b">
            <td class="py-3 font-mono font-bold text-violet-600">#PKG-${o.id}</td>
            <td><b>${o.customer_name}</b><br><span class="text-slate-400">${o.customer_phone}</span></td>
            <td class="max-w-xs">${itemsStr}</td>
            <td class="font-bold text-emerald-600">${Number(o.seller_payout || 0).toLocaleString()} Ks</td>
            <td><span class="px-2 py-0.5 rounded font-bold text-[10px] ${o.payout_status==='paid'?'bg-emerald-50 text-emerald-600':'bg-amber-50 text-amber-600'}">${o.payout_status.toUpperCase()}</span></td>
            <td>
              <select onchange="updateOrderStatus(${o.id}, this.value)" class="border rounded p-1.5 bg-white font-bold text-xs">
                <option value="pending" ${o.status==='pending'?'selected':''}>Pending</option>
                <option value="packing" ${o.status==='packing'?'selected':''}>📦 Packing</option>
                <option value="shipping" ${o.status==='shipping'?'selected':''}>🚚 Shipping</option>
                <option value="completed" ${o.status==='completed'?'selected':''} disabled>🎉 Completed</option>
              </select>
            </td>
          </tr>
        `;
      }).join('');

      document.getElementById('statTotalSales').innerText = totalSales.toLocaleString() + ' Ks';
      document.getElementById('statNetPayout').innerText = totalPayout.toLocaleString() + ' Ks';
      document.getElementById('statTotalOrders').innerText = orders.length + ' ခု';
    }

    async function updateOrderStatus(orderId, status) {
      let updateData = { status, order_status: status };
      if (status === 'shipping') updateData.shipped_at = new Date().toISOString();
      await client.from('orders').update(updateData).eq('id', orderId);
      Swal.fire({ icon: 'success', title: 'ပြောင်းလဲပြီးပါပြီ', timer: 1500, showConfirmButton: false });
    }

    function initRealtimeSubscription() {
      client.channel('seller_realtime')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders', filter: `shop_id=eq.${myShop.id}` }, payload => {
          Swal.fire({ icon: 'info', title: '🔔 အော်ဒါအသစ် ရောက်ရှိပါသည်!', text: `Order #PKG-${payload.new.id}` });
          loadShopOrders();
        }).subscribe();
    }

    async function sellerLogout(){ await client.auth.signOut(); location.href = 'index.html'; }
    initSeller();
  </script>
</body>
</html>
