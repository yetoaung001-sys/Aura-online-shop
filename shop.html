<!DOCTYPE html>
<html lang="my" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Aura Marketplace - Store</title>

  <script>
    (function() {
      const SUPABASE_ORIGIN = 'https://zyajlsrytjvwxqtpxrqd.supabase.co';
      const PROXY_ORIGIN = window.location.origin + '/api/supabase';
      function rewriteUrl(url) {
        if (typeof url === 'string' && url.startsWith(SUPABASE_ORIGIN)) {
          return url.replace(SUPABASE_ORIGIN, PROXY_ORIGIN);
        }
        return url;
      }
      const originalSrcDescriptor = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
      if (originalSrcDescriptor) {
        Object.defineProperty(HTMLImageElement.prototype, 'src', {
          set: function(val) { originalSrcDescriptor.set.call(this, rewriteUrl(val)); },
          get: originalSrcDescriptor.get
        });
      }
      const originalSetAttribute = Element.prototype.setAttribute;
      Element.prototype.setAttribute = function(name, val) {
        if ((name === 'src' || name === 'href') && typeof val === 'string') {
          val = rewriteUrl(val);
        }
        return originalSetAttribute.call(this, name, val);
      };
      const origFetch = window.fetch;
      window.fetch = function(resource, init) {
        if (typeof resource === 'string') {
          resource = rewriteUrl(resource);
        } else if (resource instanceof Request) {
          resource = new Request(rewriteUrl(resource.url), resource);
        }
        return origFetch.call(this, resource, init);
      };
    })();
  </script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Padauk:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Plus Jakarta Sans', 'Padauk', sans-serif; background-color: #f8fafc; color: #0f172a; -webkit-tap-highlight-color: transparent; font-size: 20px; }
  </style>
</head>
<body class="pb-24">

  <!-- HEADER -->
  <header class="bg-white/95 backdrop-blur-md border-b border-slate-100 sticky top-0 z-40 shadow-xs">
    <div class="max-w-7xl mx-auto px-3 sm:px-4 h-18 sm:h-20 flex items-center justify-between gap-2 sm:gap-4">
      <div class="flex items-center gap-2.5 cursor-pointer group shrink-0" onclick="location.href='index.html'">
        <div id="shopHeaderLogoBox" class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-gradient-to-br from-violet-600 to-rose-500 text-white font-black flex items-center justify-center text-xl sm:text-2xl shadow-md overflow-hidden">
          <i class="ph-bold ph-storefront"></i>
        </div>
        <div>
          <span id="shopTitleHeader" class="font-extrabold text-lg sm:text-xl leading-none block text-slate-900">AURA STORE</span>
          <span class="text-[10px] text-violet-700 font-extrabold uppercase tracking-widest block mt-0.5">Verified Shop</span>
        </div>
      </div>

      <div class="flex-1 max-w-xl relative">
        <input type="text" id="shopSearchInput" oninput="handleShopSearch(this.value)" autocomplete="search" placeholder="ဤဆိုင်အတွင်း ပစ္စည်းရှာဖွေရန်..." class="w-full pl-10 sm:pl-12 pr-3 py-3 bg-slate-100 border border-slate-200 rounded-2xl text-xs sm:text-sm outline-none focus:bg-white focus:border-violet-600 transition font-semibold" />
        <i class="ph ph-magnifying-glass absolute left-3.5 top-3.5 sm:top-4 text-slate-400 text-base sm:text-lg"></i>
      </div>

      <div class="flex items-center gap-2.5 shrink-0">
        <a href="index.html" class="px-3.5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-2xl font-extrabold text-xs sm:text-sm flex items-center gap-1.5 transition">
          <i class="ph-bold ph-house text-lg"></i>
          <span class="hidden md:inline">ပင်မသို့</span>
        </a>

        <button type="button" onclick="openCart()" class="relative p-3 bg-rose-50 text-rose-600 rounded-2xl transition border border-rose-100 cursor-pointer shadow-xs">
          <i class="ph-bold ph-shopping-bag-open text-lg sm:text-xl"></i>
          <span id="cartBadge" class="absolute -top-1 -right-1 bg-rose-600 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-black scale-0 transition-transform">0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-3 sm:px-4 py-6 space-y-6">
    <!-- SHOP INFO BANNER -->
    <div class="bg-white rounded-3xl p-6 shadow-xs border border-slate-200 flex flex-col sm:flex-row items-center gap-4">
      <img id="shopBannerLogo" src="https://placehold.co/80" class="w-20 h-20 rounded-2xl object-cover border shadow-md" />
      <div class="text-center sm:text-left space-y-1">
        <h2 id="shopNameDisplay" class="text-xl sm:text-2xl font-black text-slate-900">ဆိုင်အမည်</h2>
        <p id="shopNoticeDisplay" class="text-xs sm:text-sm text-slate-500 font-medium">ကြိုဆိုပါတယ်ခင်ဗျာ</p>
      </div>
    </div>

    <div class="flex justify-between items-center bg-white p-4 sm:p-6 rounded-3xl border border-slate-100 shadow-xs">
      <div>
        <h2 class="font-extrabold text-slate-900 text-base sm:text-xl">ဤဆိုင်၏ ကုန်ပစ္စည်းများ</h2>
        <p class="text-xs sm:text-sm text-slate-500 font-semibold mt-0.5">အရည်အသွေးမြင့် ပစ္စည်းများကို တိုက်ရိုက်ဝယ်ယူပါ</p>
      </div>
      <span id="productCountBadge" class="text-xs sm:text-sm font-extrabold bg-violet-50 text-violet-700 px-3.5 py-2 rounded-2xl border border-violet-100">Loading...</span>
    </div>

    <div id="shopProductGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3.5 sm:gap-6"></div>
  </main>

  <!-- PRODUCT BUY MODAL -->
  <div id="buyModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden items-center justify-center p-3 sm:p-4">
    <div class="bg-white w-full max-w-lg rounded-3xl p-5 sm:p-6 space-y-4 text-xs sm:text-sm shadow-2xl max-h-[92vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-extrabold text-sm sm:text-base text-slate-900">📦 ကုန်ပစ္စည်း အသေးစိတ်နှင့် ဝယ်ယူရန်</h3>
        <button type="button" onclick="closeBuyModal()" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center cursor-pointer"><i class="ph ph-x text-base"></i></button>
      </div>
      
      <div class="space-y-3">
        <div class="overflow-hidden rounded-2xl border bg-slate-100"><img id="detailMainImg" src="" alt="Product Detail" class="w-full h-60 sm:h-72 object-cover" /></div>
        <div id="detailThumbnails" class="flex gap-2 overflow-x-auto pb-1"></div>
      </div>

      <div class="space-y-2">
        <h4 id="detailTitle" class="font-extrabold text-sm sm:text-base text-slate-900 leading-snug"></h4>
        <div class="flex items-center gap-2">
          <span id="detailStockBadge" class="px-3 py-1 rounded-xl font-extrabold text-xs"></span>
        </div>
        <div id="detailPriceContainer" class="pt-1.5 flex items-baseline gap-2"></div>
      </div>

      <div id="sizeSelectionArea" class="space-y-2 hidden"><span class="font-bold text-slate-700 block">📏 Size ရွေးပါ:</span><div id="sizeOptionsList" class="flex flex-wrap gap-2"></div></div>
      <div id="colorSelectionArea" class="space-y-2 hidden"><span class="font-bold text-slate-700 block">🎨 Color ရွေးပါ:</span><div id="colorOptionsList" class="flex flex-wrap gap-2"></div></div>
      
      <div>
        <label for="buyQty" class="font-bold block mb-1 text-slate-700">အရေအတွက်</label>
        <input id="buyQty" type="number" min="1" value="1" class="w-full border bg-slate-50 p-3 rounded-xl outline-none font-extrabold text-slate-800 text-sm" />
      </div>
      <button type="button" onclick="confirmAddToCart()" class="w-full bg-gradient-to-r from-violet-600 to-rose-600 text-white font-extrabold py-3.5 rounded-2xl shadow-lg text-sm cursor-pointer">ဈေးတောင်းထဲသို့ ထည့်မည်</button>
    </div>
  </div>

  <!-- CART DRAWER -->
  <div id="cartModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden justify-end">
    <div class="bg-white w-full max-w-md h-full flex flex-col p-5 sm:p-6 shadow-2xl">
      <div class="flex justify-between items-center pb-4 border-b">
        <h3 class="font-extrabold text-base sm:text-lg text-slate-900">🛒 စျေးဝယ်တွန်းလှည်း</h3>
        <button type="button" onclick="closeCart()" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center cursor-pointer"><i class="ph ph-x text-base"></i></button>
      </div>
      <div id="cartItems" class="flex-1 overflow-y-auto divide-y divide-slate-100 text-xs sm:text-sm py-2"></div>
      <div class="border-t pt-4 space-y-3 text-xs sm:text-sm bg-white">
        <div class="flex justify-between font-extrabold px-1"><span>စုစုပေါင်း:</span><span id="cartTotal" class="text-rose-600 text-base sm:text-lg">0 MMK</span></div>
        <button type="button" onclick="proceedCheckout()" class="w-full bg-violet-600 hover:bg-violet-700 text-white py-3.5 rounded-2xl font-extrabold shadow-lg cursor-pointer text-sm">ပင်မစာမျက်နှာသို့ သွား၍ Checkout လုပ်မည်</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = window.location.origin + '/api/supabase';
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5YWpsc3J5dGp2d3hxdHB4cnFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4Nzg1MjEsImV4cCI6MjEwNDQ1NDUyMX0.Tl_nrEQzt2wmCd9sZaLPr7Y5F97DKms9BCckZfI8WZ8";
    
    const client = supabase.createClient(SUPABASE_URL, SB_KEY, {
      auth: { persistSession: true },
      realtime: { params: { eventsPerSecond: 0 } }
    });

    function toProxyUrl(url) {
      if (!url || typeof url !== 'string') return 'https://placehold.co/300';
      const SUPABASE_ORIGIN = 'https://zyajlsrytjvwxqtpxrqd.supabase.co';
      if (url.startsWith(SUPABASE_ORIGIN)) {
        return url.replace(SUPABASE_ORIGIN, window.location.origin + '/api/supabase');
      }
      return url;
    }

    const Toast = Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 3000, timerProgressBar: true });

    let shopId = null, currentShop = null, shopProducts = [], cart = [];
    let selectedProductForBuy = null, chosenSize = '', chosenColor = '', shopSearchQuery = '';

    function esc(v){ return String(v ?? '').replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;' }[m])); }

    async function initShop() {
      const urlParams = new URLSearchParams(window.location.search);
      shopId = urlParams.get('id') || urlParams.get('shop_id');
      
      if (!shopId) {
        const { data: shops } = await client.from('shops').select('*').limit(1);
        if (shops && shops.length) shopId = shops[0].id;
      }

      if (!shopId) {
        document.getElementById('shopProductGrid').innerHTML = '<div class="col-span-full py-12 text-center text-rose-500 font-bold">ဆိုင်အချက်အလက် ရှာမတွေ့ပါ</div>';
        return;
      }

      const [shopRes, prodRes] = await Promise.all([
        client.from('shops').select('*').eq('id', shopId).maybeSingle(),
        client.from('products').select('*, shops(*)').eq('shop_id', shopId).order('id', { ascending: false })
      ]);

      if (shopRes.data) {
        currentShop = shopRes.data;
        document.getElementById('shopTitleHeader').innerText = currentShop.name || 'Aura Store';
        document.getElementById('shopNameDisplay').innerText = currentShop.name || 'Aura Store';
        document.getElementById('shopNoticeDisplay').innerText = currentShop.notice_board || currentShop.address || 'ကြိုဆိုပါတယ်ခင်ဗျာ';
        if (currentShop.logo_url) {
          document.getElementById('shopBannerLogo').src = toProxyUrl(currentShop.logo_url);
          document.getElementById('shopHeaderLogoBox').innerHTML = `<img src="${toProxyUrl(currentShop.logo_url)}" class="w-full h-full object-cover" />`;
        }
      }

      shopProducts = prodRes.data || [];
      loadUserCart();
      renderShopProducts();
      updateCartUI();
    }

    function renderShopProducts() {
      const grid = document.getElementById('shopProductGrid');
      let list = shopProducts;
      if (shopSearchQuery) list = list.filter(p => (p.title || p.name || '').toLowerCase().includes(shopSearchQuery));
      document.getElementById('productCountBadge').innerText = `${list.length} မျိုး`;

      if (!list.length) {
        grid.innerHTML = '<div class="col-span-full py-16 text-center text-slate-400 font-semibold">ဤဆိုင်တွင် ကုန်ပစ္စည်း မရှိသေးပါ။</div>';
        return;
      }

      grid.innerHTML = list.map(p => {
        const originalPrice = Number(p.price || 0);
        const flashPrice = Number(p.flash_price || 0);
        const hasDiscount = flashPrice > 0 && flashPrice < originalPrice;
        const displayPrice = hasDiscount ? flashPrice : originalPrice;
        const image = toProxyUrl((p.images && p.images[0]) || p.image);
        const stock = Number(p.stock || 0);

        return `
          <div class="bg-white rounded-3xl border border-slate-100 p-3 sm:p-4 flex flex-col justify-between hover:shadow-xl transition duration-300 group shadow-xs">
            <div>
              <div class="relative cursor-pointer overflow-hidden rounded-2xl bg-slate-100 mb-3" onclick="openBuyModal(${p.id})">
                <img src="${image}" alt="${esc(p.title || p.name)}" class="w-full h-40 sm:h-52 object-cover group-hover:scale-105 transition duration-500" />
                <span class="absolute top-2.5 right-2.5 bg-emerald-600 text-white text-[10px] px-2 py-0.5 rounded-lg font-bold shadow">📦 ${stock}</span>
              </div>
              <h4 class="font-extrabold text-xs sm:text-sm text-slate-900 line-clamp-2 cursor-pointer" onclick="openBuyModal(${p.id})">${esc(p.title || p.name)}</h4>
              <div class="mt-2 flex items-baseline gap-2 flex-wrap">
                <span class="text-sm sm:text-base font-black text-rose-600">${displayPrice.toLocaleString()} Ks</span>
                ${hasDiscount ? `<span class="text-xs font-bold text-slate-400 line-through">${originalPrice.toLocaleString()} Ks</span>` : ''}
              </div>
            </div>
            <button type="button" onclick="openBuyModal(${p.id})" ${stock <= 0 ? 'disabled' : ''} class="mt-4 w-full ${stock <= 0 ? 'bg-slate-200 text-slate-400 cursor-not-allowed' : 'bg-slate-900 hover:bg-violet-600 text-white cursor-pointer'} py-2.5 rounded-2xl text-xs sm:text-sm font-extrabold transition shadow-xs">
              ${stock <= 0 ? 'ကုန်နေပါသည်' : 'အသေးစိတ်ကြည့်မည်'}
            </button>
          </div>
        `;
      }).join('');
    }

    function handleShopSearch(val) { shopSearchQuery = val.trim().toLowerCase(); renderShopProducts(); }

    function openBuyModal(productId) {
      const product = shopProducts.find(p => Number(p.id) === Number(productId));
      if (!product) return;
      selectedProductForBuy = product; chosenSize = ''; chosenColor = '';

      const rawImgs = product.images && product.images.length ? product.images : (product.image ? [product.image] : ['https://placehold.co/300']);
      const imgs = rawImgs.map(toProxyUrl);

      document.getElementById('detailMainImg').src = imgs[0];
      document.getElementById('detailThumbnails').innerHTML = imgs.map((img, idx) => `
        <img src="${img}" alt="Thumb" onclick="document.getElementById('detailMainImg').src='${img}'" class="w-14 h-14 object-cover rounded-2xl border-2 ${idx === 0 ? 'border-violet-600' : 'border-slate-200'} cursor-pointer" />
      `).join('');

      document.getElementById('detailTitle').innerText = product.title || product.name || '';

      const sizeArea = document.getElementById('sizeSelectionArea');
      if (product.sizes && product.sizes.length) {
        sizeArea.classList.remove('hidden');
        document.getElementById('sizeOptionsList').innerHTML = product.sizes.map((s, idx) => `
          <button type="button" onclick="selectSize('${s}', this)" class="size-btn px-4 py-2 rounded-xl border font-bold text-xs ${idx === 0 ? 'border-violet-600 bg-violet-50 text-violet-700' : 'border-slate-200 bg-slate-50'}">${s}</button>
        `).join('');
        chosenSize = product.sizes[0];
      } else sizeArea.classList.add('hidden');

      const colorArea = document.getElementById('colorSelectionArea');
      if (product.colors && product.colors.length) {
        colorArea.classList.remove('hidden');
        document.getElementById('colorOptionsList').innerHTML = product.colors.map((c, idx) => `
          <button type="button" onclick="selectColor('${c}', this)" class="color-btn px-4 py-2 rounded-xl border font-bold text-xs ${idx === 0 ? 'border-violet-600 bg-violet-50 text-violet-700' : 'border-slate-200 bg-slate-50'}">${c}</button>
        `).join('');
        chosenColor = product.colors[0];
      } else colorArea.classList.add('hidden');

      updateVariantPriceAndStockDisplay();

      document.getElementById('buyModal').classList.remove('hidden');
      document.getElementById('buyModal').classList.add('flex');
    }

    function selectSize(s, el){ 
      chosenSize = s; 
      document.querySelectorAll('.size-btn').forEach(b => b.className = "size-btn px-4 py-2 rounded-xl border font-bold text-xs border-slate-200 bg-slate-50"); 
      el.className = "size-btn px-4 py-2 rounded-xl border font-bold text-xs border-violet-600 bg-violet-50 text-violet-700"; 
      updateVariantPriceAndStockDisplay();
    }
    
    function selectColor(c, el){ 
      chosenColor = c; 
      document.querySelectorAll('.color-btn').forEach(b => b.className = "color-btn px-4 py-2 rounded-xl border font-bold text-xs border-slate-200 bg-slate-50"); 
      el.className = "color-btn px-4 py-2 rounded-xl border font-bold text-xs border-violet-600 bg-violet-50 text-violet-700"; 
      updateVariantPriceAndStockDisplay();
    }

    function updateVariantPriceAndStockDisplay() {
      if (!selectedProductForBuy) return;
      let activePrice = Number(selectedProductForBuy.flash_price > 0 ? selectedProductForBuy.flash_price : selectedProductForBuy.price);
      let activeStock = Number(selectedProductForBuy.stock || 0);

      if (selectedProductForBuy.variant_prices && chosenColor && chosenSize) {
        const pKey = `${chosenColor}_${chosenSize}`;
        if (selectedProductForBuy.variant_prices[pKey]) activePrice = Number(selectedProductForBuy.variant_prices[pKey]);
      }

      if (selectedProductForBuy.variant_stocks && Array.isArray(selectedProductForBuy.variant_stocks) && chosenColor && chosenSize) {
        const found = selectedProductForBuy.variant_stocks.find(v => v.color === chosenColor && v.size === chosenSize);
        if (found) activeStock = Number(found.stock || 0);
      }

      document.getElementById('detailPriceContainer').innerHTML = `<span class="text-2xl font-black text-rose-600">${activePrice.toLocaleString()} MMK</span>`;
      const stockBadge = document.getElementById('detailStockBadge');
      stockBadge.className = activeStock > 0 ? "px-3 py-1 rounded-xl font-extrabold text-xs bg-emerald-50 text-emerald-700 border border-emerald-200" : "px-3 py-1 rounded-xl font-black text-xs bg-rose-50 text-rose-700 border border-rose-200";
      stockBadge.innerText = activeStock > 0 ? `📦 လက်ကျန်: ${activeStock}` : `❌ ကုန်နေပါသည်`;
    }

    function closeBuyModal(){ document.getElementById('buyModal').classList.add('hidden'); document.getElementById('buyModal').classList.remove('flex'); }

    function getCartKey() { return `aura_shop_cart_${shopId}`; }
    function loadUserCart() { cart = JSON.parse(localStorage.getItem(getCartKey()) || '[]'); }
    function saveCart() { localStorage.setItem(getCartKey(), JSON.stringify(cart)); }

    function confirmAddToCart() {
      if (!selectedProductForBuy) return;
      const qty = Math.max(1, Number(document.getElementById('buyQty').value) || 1);
      
      let activePrice = Number(selectedProductForBuy.flash_price > 0 ? selectedProductForBuy.flash_price : selectedProductForBuy.price);
      let activeStock = Number(selectedProductForBuy.stock || 0);

      if (selectedProductForBuy.variant_prices && chosenColor && chosenSize) {
        const pKey = `${chosenColor}_${chosenSize}`;
        if (selectedProductForBuy.variant_prices[pKey]) activePrice = Number(selectedProductForBuy.variant_prices[pKey]);
      }
      if (selectedProductForBuy.variant_stocks && chosenColor && chosenSize) {
        const found = selectedProductForBuy.variant_stocks.find(v => v.color === chosenColor && v.size === chosenSize);
        if (found) activeStock = Number(found.stock || 0);
      }

      if (qty > activeStock) return Swal.fire({ icon: 'warning', title: 'Stock မလုံလောက်ပါ', text: `လက်ကျန် ${activeStock} ခုသာ ရှိပါသည်` });

      const key = `${selectedProductForBuy.id}|${chosenSize}|${chosenColor}`;
      const existing = cart.find(i => i.key === key);
      const itemImg = toProxyUrl((selectedProductForBuy.images && selectedProductForBuy.images[0]) || selectedProductForBuy.image);

      if (existing) existing.qty = Math.min(existing.qty + qty, activeStock);
      else {
        cart.push({
          key,
          id: selectedProductForBuy.id,
          title: selectedProductForBuy.title || selectedProductForBuy.name,
          price: activePrice,
          image: itemImg,
          shop_id: shopId,
          shop_name: currentShop?.name || 'Aura Store',
          shop_township: currentShop?.township || '',
          shipping_fee: Number(currentShop?.shipping_fee || 0),
          gate_fee: Number(currentShop?.delivery_fee || 0),
          selectedSize: chosenSize,
          selectedColor: chosenColor,
          qty,
          checked: true
        });
      }
      saveCart(); updateCartUI(); closeBuyModal();
      Toast.fire({ icon: 'success', title: 'စျေးဝယ်တွန်းလှည်းထဲ ထည့်ပြီးပါပြီ' });
    }

    function updateCartUI() {
      document.getElementById('cartBadge').innerText = cart.reduce((s, i) => s + i.qty, 0);
      document.getElementById('cartBadge').style.transform = cart.length ? 'scale(1)' : 'scale(0)';
      document.getElementById('cartTotal').innerText = (cart.reduce((s, i) => s + (i.price * i.qty), 0)).toLocaleString() + ' MMK';

      const box = document.getElementById('cartItems');
      if (!cart.length) { box.innerHTML = '<div class="py-12 text-center text-slate-400 font-semibold">တောင်းထဲတွင် ပစ္စည်းမရှိသေးပါ</div>'; return; }
      box.innerHTML = cart.map((i, idx) => `
        <div class="py-3 flex items-center gap-3">
          <img src="${i.image}" alt="Item" class="w-12 h-12 rounded-2xl object-cover border" />
          <div class="flex-1">
            <h5 class="font-extrabold line-clamp-1 text-slate-900">${esc(i.title)}</h5>
            <div class="text-xs text-slate-500 font-medium">${i.selectedColor ? 'Color: ' + esc(i.selectedColor) : ''} ${i.selectedSize ? 'Size: ' + esc(i.selectedSize) : ''}</div>
            <div class="text-rose-600 font-black text-xs mt-0.5">${i.price.toLocaleString()} Ks x ${i.qty}</div>
          </div>
          <button type="button" onclick="cart.splice(${idx}, 1); saveCart(); updateCartUI();" class="text-rose-500 p-2 cursor-pointer"><i class="ph ph-trash text-base"></i></button>
        </div>
      `).join('');
    }

    function openCart(){ document.getElementById('cartModal').classList.remove('hidden'); document.getElementById('cartModal').classList.add('flex'); }
    function closeCart(){ document.getElementById('cartModal').classList.add('hidden'); document.getElementById('cartModal').classList.remove('flex'); }

    function proceedCheckout() {
      if (!cart.length) return Swal.fire({ icon: 'warning', title: 'တောင်းထဲတွင် ပစ္စည်းမရှိသေးပါ' });
      // Main index.html သို့ cart အချက်အလက်များ sync လုပ်ပေးပြီး ပို့မည်
      const globalCart = JSON.parse(localStorage.getItem(`aura_cart_guest`) || '[]');
      cart.forEach(item => {
        const found = globalCart.find(g => g.key === item.key);
        if (found) found.qty = item.qty;
        else globalCart.push(item);
      });
      localStorage.setItem(`aura_cart_guest`, JSON.stringify(globalCart));
      window.location.href = 'index.html';
    }

    document.addEventListener('DOMContentLoaded', initShop);
  </script>
</body>
</html>
