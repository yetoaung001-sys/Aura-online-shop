<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Aura Marketplace - Online Shopping</title>

  <!-- Global Reverse Proxy URL Rewriter -->
  <script>
    (function() {
      const SUPABASE_ORIGIN = 'https://zyajlsrytjvwxqtpxrqd.supabase.co';
      const PROXY_ORIGIN = window.location.origin + '/api/supabase';
      function rewriteUrl(url) {
        if (typeof url === 'string' && url.startsWith(SUPABASE_ORIGIN)) {
          return url.replace(SUPABASE_ORIGIN, PROXY_ORIGIN);
        }
        return url;
      }
      const originalSrcDescriptor = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
      if (originalSrcDescriptor) {
        Object.defineProperty(HTMLImageElement.prototype, 'src', {
          set: function(val) { originalSrcDescriptor.set.call(this, rewriteUrl(val)); },
          get: originalSrcDescriptor.get
        });
      }
      const originalSetAttribute = Element.prototype.setAttribute;
      Element.prototype.setAttribute = function(name, val) {
        if ((name === 'src' || name === 'href') && typeof val === 'string') {
          val = rewriteUrl(val);
        }
        return originalSetAttribute.call(this, name, val);
      };
      const origFetch = window.fetch;
      window.fetch = function(resource, init) {
        if (typeof resource === 'string') {
          resource = rewriteUrl(resource);
        } else if (resource instanceof Request) {
          resource = new Request(rewriteUrl(resource.url), resource);
        }
        return origFetch.call(this, resource, init);
      };
    })();
  </script>

  <!-- Tailwind CSS Production CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap');
    body { font-family: 'Padauk', sans-serif; font-size: 19px; background-color: #f8fafc; color: #0f172a; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="pb-24">

  <!-- HEADER -->
  <header class="bg-slate-900 text-white sticky top-0 z-50 shadow">
    <div class="max-w-7xl mx-auto px-4 py-3.5 flex justify-between items-center">
      <div class="flex items-center space-x-2.5">
        <a href="index.html" class="bg-violet-600 text-white text-[11px] px-2.5 py-1 rounded-lg font-extrabold uppercase">Aura Market</a>
        <h1 id="shopTitleHeader" class="text-base sm:text-lg font-extrabold tracking-tight">ဆိုင်ခွဲ ဈေးဆိုင်</h1>
      </div>
      <div class="flex items-center space-x-3">
        <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-xl font-bold transition">
          <i class="fa-solid fa-house mr-1"></i> ပင်မသို့
        </a>
        <button type="button" onclick="openCartModal()" class="relative bg-violet-600 hover:bg-violet-700 px-3.5 py-1.5 rounded-xl font-bold transition text-xs cursor-pointer">
          <i class="fa-solid fa-cart-shopping mr-1"></i> တောင်းထဲသို့ (<span id="cartCount">0</span>)
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="max-w-7xl mx-auto px-3 sm:px-4 py-5 space-y-6">

    <!-- SHOP BANNER / INFO -->
    <div id="shopInfoContainer" class="bg-white rounded-3xl p-6 shadow-xs border border-slate-200 text-center space-y-2">
      <h2 id="shopNameDisplay" class="text-xl sm:text-2xl font-black text-slate-900">ဆိုင်အမည်</h2>
      <p id="shopNoticeDisplay" class="text-xs sm:text-sm text-slate-500">ကြိုဆိုပါတယ်ခင်ဗျာ</p>
    </div>

    <!-- PRODUCTS GRID -->
    <div class="space-y-3">
      <h3 class="font-extrabold text-slate-900 text-base sm:text-lg"><i class="fa-solid fa-box text-violet-600 mr-1.5"></i> ရရှိနိုင်သော ကုန်ပစ္စည်းများ</h3>
      <div id="shopProductsGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4">
        <div class="col-span-full py-12 text-center text-slate-400 font-semibold">ကုန်ပစ္စည်းများ ရယူနေပါသည်...</div>
      </div>
    </div>

  </main>

  <!-- PRODUCT DETAIL & VARIANT MODAL -->
  <div id="productDetailModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden items-center justify-center p-4">
    <div class="bg-white w-full max-w-lg rounded-3xl p-6 space-y-4 text-xs sm:text-sm shadow-2xl relative max-h-[90vh] overflow-y-auto">
      <button type="button" onclick="closeProductModal()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
      
      <div id="modalProductContent" class="space-y-4">
        <!-- Dynamic Product Details & Variants Selection -->
      </div>
    </div>
  </div>

  <!-- CART SIDEBAR/MODAL -->
  <div id="cartModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-3xl p-6 space-y-4 text-xs sm:text-sm shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-extrabold text-slate-900 text-base">🛒 ဝယ်ယူမည့် ပစ္စည်းများ</h3>
        <button type="button" onclick="closeCartModal()" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="cartItemsList" class="space-y-3 divide-y">
        <p class="text-center text-slate-400 py-4">တောင်းထဲတွင် ပစ္စည်းမရှိသေးပါ</p>
      </div>
      <div class="border-t pt-3 space-y-2">
        <div class="flex justify-between font-black text-base">
          <span>စုစုပေါင်းကျသင့်ငွေ:</span>
          <span id="cartTotalPrice" class="text-rose-600">0 Ks</span>
        </div>
        <button type="button" onclick="proceedCheckout()" class="w-full bg-violet-600 text-white font-extrabold py-3.5 rounded-2xl hover:bg-violet-700 transition cursor-pointer">အော်ဒါတင်မည် (Checkout)</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = window.location.origin + '/api/supabase';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5YWpsc3J5dGp2d3hxdHB4cnFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4Nzg1MjEsImV4cCI6MjEwNDQ1NDUyMX0.Tl_nrEQzt2wmCd9sZaLPr7Y5F97DKms9BCckZfI8WZ8';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { realtime: { params: { eventsPerSecond: 0 } } });

    let shopId = null;
    let currentShopData = null;
    let cart = [];

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    }

    async function initShopPage() {
      const urlParams = new URLSearchParams(window.location.search);
      shopId = urlParams.get('id') || urlParams.get('shop_id');
      
      if (!shopId) {
        // Default first shop if no ID provided
        const { data: shops } = await client.from('shops').select('*').limit(1);
        if (shops && shops.length) { shopId = shops[0].id; }
      }

      if (shopId) {
        await loadShopDetails(shopId);
        await loadShopProducts(shopId);
      } else {
        document.getElementById('shopProductsGrid').innerHTML = '<div class="col-span-full py-12 text-center text-rose-500 font-bold">ဆိုင်အချက်အလက် ရှာမတွေ့ပါ</div>';
      }
    }

    async function loadShopDetails(id) {
      const { data: shop } = await client.from('shops').select('*').eq('id', id).maybeSingle();
      if (shop) {
        currentShopData = shop;
        document.getElementById('shopTitleHeader').innerText = shop.name || 'ဆိုင်ခွဲ';
        document.getElementById('shopNameDisplay').innerText = shop.name || 'ဆိုင်ခွဲ';
        document.getElementById('shopNoticeDisplay').innerText = shop.notice_board || shop.address || 'ကြိုဆိုပါတယ်ခင်ဗျာ';
      }
    }

    async function loadShopProducts(id) {
      const grid = document.getElementById('shopProductsGrid');
      const { data: prods, error } = await client.from('products').select('*').eq('shop_id', id).order('id', { ascending: false });

      if (error || !prods || !prods.length) {
        grid.innerHTML = '<div class="col-span-full py-12 text-center text-slate-400 font-semibold">ဤဆိုင်တွင် ကုန်ပစ္စည်း မရှိသေးပါ။</div>';
        return;
      }

      grid.innerHTML = prods.map(p => {
        const origPrice = Number(p.price || 0);
        const flashPrice = Number(p.flash_price || 0);
        const hasDiscount = flashPrice > 0 && flashPrice < origPrice;
        const imgUrl = (p.images && p.images[0]) || p.image || 'https://placehold.co/300';

        return `
          <div onclick='openProductModal(${JSON.stringify(p)})' class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-xs hover:shadow-md transition cursor-pointer flex flex-col justify-between">
            <div>
              <img src="${escapeHtml(imgUrl)}" class="w-full h-40 object-cover" />
              <div class="p-3 space-y-1">
                <h4 class="font-extrabold text-slate-900 text-xs sm:text-sm line-clamp-1">${escapeHtml(p.title || p.name)}</h4>
                <div class="flex items-center space-x-2">
                  <span class="font-black text-rose-600 text-xs sm:text-sm">${hasDiscount ? flashPrice.toLocaleString() : origPrice.toLocaleString()} Ks</span>
                  ${hasDiscount ? `<span class="text-[10px] text-slate-400 line-through">${origPrice.toLocaleString()} Ks</span>` : ''}
                </div>
              </div>
            </div>
            <div class="p-3 pt-0">
              <button type="button" class="w-full bg-slate-900 hover:bg-violet-700 text-white text-xs font-extrabold py-2 rounded-xl transition">ကြည့်မည် / ဝယ်မည်</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function openProductModal(prod) {
      const modal = document.getElementById('productDetailModal');
      const content = document.getElementById('modalProductContent');
      const origPrice = Number(prod.price || 0);
      const flashPrice = Number(prod.flash_price || 0);
      const hasDiscount = flashPrice > 0 && flashPrice < origPrice;
      const imgUrl = (prod.images && prod.images[0]) || prod.image || 'https://placehold.co/400';
      const sizes = Array.isArray(prod.sizes) ? prod.sizes : [];
      const colors = Array.isArray(prod.colors) ? prod.colors : [];

      content.innerHTML = `
        <img src="${escapeHtml(imgUrl)}" class="w-full h-56 object-cover rounded-2xl border" />
        <h3 class="font-black text-slate-900 text-base sm:text-lg">${escapeHtml(prod.title || prod.name)}</h3>
        <div class="flex items-center space-x-3">
          <span class="font-black text-rose-600 text-lg">${hasDiscount ? flashPrice.toLocaleString() : origPrice.toLocaleString()} Ks</span>
          ${hasDiscount ? `<span class="text-xs text-slate-400 line-through">${origPrice.toLocaleString()} Ks</span>` : ''}
        </div>
        <p class="text-xs text-slate-500">လက်ကျန် Stock: <b>${prod.stock || 0}</b> ခု</p>

        ${sizes.length ? `
          <div>
            <label class="block font-bold text-slate-700 mb-1 text-xs">Size ရွေးချယ်ပါ:</label>
            <div id="selectedSizeContainer" class="flex flex-wrap gap-2">
              ${sizes.map((s, idx) => `<button type="button" onclick="selectSize('${escapeHtml(s)}')" class="size-btn px-3 py-1.5 border rounded-xl text-xs font-bold ${idx===0?'border-violet-600 bg-violet-50 text-violet-700':''}">${escapeHtml(s)}</button>`).join('')}
            </div>
          </div>
        ` : ''}

        ${colors.length ? `
          <div>
            <label class="block font-bold text-slate-700 mb-1 text-xs">Colour ရွေးချယ်ပါ:</label>
            <div id="selectedColorContainer" class="flex flex-wrap gap-2">
              ${colors.map((c, idx) => `<button type="button" onclick="selectColor('${escapeHtml(c)}')" class="color-btn px-3 py-1.5 border rounded-xl text-xs font-bold ${idx===0?'border-violet-600 bg-violet-50 text-violet-700':''}">${escapeHtml(c)}</button>`).join('')}
            </div>
          </div>
        ` : ''}

        <button type="button" onclick='addToCart(${JSON.stringify(prod)}, "${sizes[0] || ''}", "${colors[0] || ''}")' class="w-full bg-violet-600 text-white font-extrabold py-3.5 rounded-2xl hover:bg-violet-700 transition cursor-pointer">တောင်းထဲသို့ ထည့်မည်</button>
      `;

      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeProductModal() {
      document.getElementById('productDetailModal').classList.add('hidden');
      document.getElementById('productDetailModal').classList.remove('flex');
    }

    let selectedSizeVal = '';
    let selectedColorVal = '';
    function selectSize(val) { selectedSizeVal = val; }
    function selectColor(val) { selectedColorVal = val; }

    function addToCart(prod, defaultSize, defaultColor) {
      const size = selectedSizeVal || defaultSize || '';
      const color = selectedColorVal || defaultColor || '';
      const price = (prod.flash_price && prod.flash_price > 0 && prod.flash_price < prod.price) ? prod.flash_price : prod.price;

      const existing = cart.find(item => item.id === prod.id && item.size === size && item.color === color);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({
          id: prod.id,
          title: prod.title || prod.name,
          price: price,
          image: (prod.images && prod.images[0]) || prod.image || '',
          size: size,
          color: color,
          qty: 1
        });
      }

      updateCartUI();
      closeProductModal();
      alert('✅ ပစ္စည်း တောင်းထဲသို့ ထည့်ပြီးပါပြီ');
    }

    function updateCartUI() {
      document.getElementById('cartCount').innerText = cart.reduce((sum, item) => sum + item.qty, 0);
      const list = document.getElementById('cartItemsList');
      const totalEl = document.getElementById('cartTotalPrice');

      if (!cart.length) {
        list.innerHTML = '<p class="text-center text-slate-400 py-4">တောင်းထဲတွင် ပစ္စည်းမရှိသေးပါ</p>';
        totalEl.innerText = '0 Ks';
        return;
      }

      let total = 0;
      list.innerHTML = cart.map((item, idx) => {
        const sub = item.price * item.qty;
        total += sub;
        return `
          py-2.5 flex justify-between items-center text-xs">
            <div class="flex items-center space-x-2">
              <img src="${escapeHtml(item.image)}" class="w-10 h-10 object-cover rounded-xl border">
              <div>
                <div class="font-bold text-slate-900">${escapeHtml(item.title)}</div>
                <div class="text-[10px] text-slate-500">${item.size ? 'Size: '+item.size : ''} ${item.color ? 'Color: '+item.color : ''}</div>
                <div class="text-rose-600 font-extrabold">${item.price.toLocaleString()} Ks x ${item.qty}</div>
              </div>
            </div>
            <button type="button" onclick="removeFromCart(${idx})" class="text-rose-600 font-bold px-2 py-1"><i class="fa-solid fa-trash"></i></button>
          </div>
        `;
      }).join('');

      totalEl.innerText = total.toLocaleString() + ' Ks';
    }

    function removeFromCart(idx) {
      cart.splice(idx, 1);
      updateCartUI();
    }

    function openCartModal() {
      document.getElementById('cartModal').classList.remove('hidden');
      document.getElementById('cartModal').classList.add('flex');
    }
    function closeCartModal() {
      document.getElementById('cartModal').classList.add('hidden');
      document.getElementById('cartModal').classList.remove('flex');
    }

    function proceedCheckout() {
      if (!cart.length) return alert('တောင်းထဲတွင် ပစ္စည်းမရှိသေးပါ');
      // Redirect to checkout or handle order placement
      localStorage.setItem('aura_cart', JSON.stringify(cart));
      localStorage.setItem('aura_checkout_shop', JSON.stringify(currentShopData));
      window.location.href = 'index.html#checkout';
    }

    document.addEventListener('DOMContentLoaded', initShopPage);
  </script>
</body>
</html>
