<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura Shop Details</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Padauk:wght@400;700&display=swap" rel="stylesheet" />
  <style>body { font-family: 'Plus Jakarta Sans', 'Padauk', sans-serif; background-color: #f8fafc; }</style>
</head>
<body class="pb-20">
  <header class="bg-white border-b sticky top-0 z-30 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 text-violet-600 font-black text-sm">
        <i class="ph-bold ph-arrow-left text-base"></i> ပင်မစာမျက်နှာသို့
      </a>
      <span class="font-extrabold text-sm text-slate-800">ဆိုင်ခွဲ အသေးစိတ်</span>
      <div class="w-10"></div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
    <div id="shopProfileCard" class="bg-white rounded-3xl p-6 border shadow-xs flex flex-col sm:flex-row items-center gap-6">
      <div class="w-24 h-24 rounded-2xl bg-slate-100 overflow-hidden border">
        <img id="shopLogo" src="https://placehold.co/100" alt="Shop Logo" class="w-full h-full object-cover" />
      </div>
      <div class="space-y-1.5 text-center sm:text-left flex-1">
        <h1 id="shopName" class="text-xl font-black text-slate-900">ဆိုင်အမည် ရှာဖွေနေပါသည်...</h1>
        <p id="shopAddress" class="text-xs text-slate-500 font-medium"></p>
        <div class="flex flex-wrap gap-2 pt-1 justify-center sm:justify-start" id="shopBadges"></div>
      </div>
    </div>

    <div class="space-y-4">
      <h3 class="font-extrabold text-slate-800 text-sm">ဤဆိုင်မှ ရောင်းချသော ပစ္စည်းများ</h3>
      <div id="shopProductGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = window.location.origin + '/api/supabase';
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5YWpsc3J5dGp2d3hxdHB4cnFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4Nzg1MjEsImV4cCI6MjEwNDQ1NDUyMX0.Tl_nrEQzt2wmCd9sZaLPr7Y5F97DKms9BCckZfI8WZ8";
    const client = supabase.createClient(SUPABASE_URL, SB_KEY);

    function getProxiedImageUrl(url) {
      if (!url) return 'https://placehold.co/300';
      const SUPABASE_ORIGIN = 'https://zyajlsrytjvwxqtpxrqd.supabase.co';
      if (url.startsWith(SUPABASE_ORIGIN)) {
        return url.replace(SUPABASE_ORIGIN, window.location.origin + '/api/supabase');
      }
      return url;
    }

    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;' }[m]));

    async function initShop() {
      const urlParams = new URLSearchParams(window.location.search);
      const shopId = urlParams.get('id');
      if (!shopId) {
        document.getElementById('shopName').innerText = 'ဆိုင်ခွဲ ရှာမတွေ့ပါ';
        return;
      }

      const [sRes, pRes] = await Promise.all([
        client.from('shops').select('*').eq('id', shopId).maybeSingle(),
        client.from('products').select('*').eq('shop_id', shopId).order('id', { ascending: false })
      ]);

      const shop = sRes.data;
      if (shop) {
        document.getElementById('shopName').innerText = shop.name || 'Aura Store';
        document.getElementById('shopAddress').innerText = `လိပ်စာ: ${shop.address || '-'}`;
        document.getElementById('shopLogo').src = getProxiedImageUrl(shop.logo_url);
        document.getElementById('shopBadges').innerHTML = `
          <span class="bg-violet-50 text-violet-700 text-[10px] font-bold px-2.5 py-1 rounded-xl">ပို့ခ: ${Number(shop.shipping_fee || 0).toLocaleString()} Ks</span>
          <span class="bg-emerald-50 text-emerald-700 text-[10px] font-bold px-2.5 py-1 rounded-xl">ဂိတ်တင်ခ: ${Number(shop.delivery_fee || 0).toLocaleString()} Ks</span>
        `;
      }

      const products = pRes.data || [];
      const grid = document.getElementById('shopProductGrid');
      if (!products.length) {
        grid.innerHTML = '<div class="col-span-full py-10 text-center text-slate-400 text-xs">ပစ္စည်း မရှိသေးပါ</div>';
        return;
      }

      grid.innerHTML = products.map(p => {
        const rawImg = (p.images && p.images[0]) || p.image || p.image_url;
        const img = getProxiedImageUrl(rawImg);
        const price = Number(p.price || 0).toLocaleString();
        return `
          <div class="bg-white rounded-2xl border p-3 flex flex-col justify-between shadow-xs">
            <div>
              <img src="${img}" alt="${esc(p.title || p.name)}" class="w-full h-36 object-cover rounded-xl mb-2" />
              <h4 class="font-bold text-xs text-slate-800 line-clamp-2">${esc(p.title || p.name)}</h4>
              <div class="text-rose-600 font-extrabold text-sm mt-1">${price} MMK</div>
            </div>
            <button type="button" onclick="location.href='index.html'" class="mt-3 w-full bg-slate-900 text-white py-2 rounded-xl text-xs font-bold">ဝယ်ယူရန်</button>
          </div>
        `;
      }).join('');
    }

    initShop();
  </script>
</body>
</html>
