<!DOCTYPE html>
<html lang="my" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura Marketplace - Shop Storefront</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Padauk:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Plus Jakarta Sans', 'Padauk', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 pb-20">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <a href="index.html" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-slate-700 transition" title="ပင်မဆိုင်သို့ ပြန်သွားမည်">
          <i class="ph-bold ph-arrow-left text-lg"></i>
        </a>
        <div class="flex items-center gap-2">
          <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-orange-500 to-rose-500 text-white font-extrabold flex items-center justify-center text-xl shadow">
            <i class="ph-bold ph-storefront"></i>
          </div>
          <div>
            <h1 id="headerShopName" class="font-extrabold text-base leading-none text-slate-900">ဆိုင်အမည် ရယူနေပါသည်...</h1>
            <span class="text-[10px] text-emerald-600 font-bold flex items-center gap-1 mt-0.5">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Aura Verified Seller
            </span>
          </div>
        </div>
      </div>
      <a href="index.html" class="text-xs font-bold text-orange-600 bg-orange-50 hover:bg-orange-100 px-3.5 py-1.5 rounded-xl transition">
        ပင်မစျေးဆိုင်သို့
      </a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-5 space-y-6">

    <!-- Shopee Style Seller Banner Profile Card -->
    <section class="bg-gradient-to-r from-slate-950 via-slate-900 to-slate-800 rounded-3xl p-6 text-white shadow-xl flex flex-col md:flex-row items-center justify-between gap-6 border border-slate-700">
      <div class="flex items-center gap-4 text-center md:text-left flex-col md:flex-row">
        <div class="w-20 h-20 rounded-2xl bg-white/10 border-2 border-orange-500 flex items-center justify-center text-orange-400 text-3xl font-black shadow-inner">
          <i class="ph-fill ph-storefront"></i>
        </div>
        <div>
          <span class="bg-orange-500 text-white font-black text-[9px] px-2.5 py-0.5 rounded uppercase tracking-wider">OFFICIAL STORE</span>
          <h2 id="shopTitle" class="text-xl sm:text-2xl font-black mt-1">ဆိုင်အမည်</h2>
          <p id="shopPhone" class="text-xs text-slate-400 mt-0.5">📞 ဖုန်းနံပါတ်: -</p>
        </div>
      </div>

      <!-- Shop Stats (Shopee Style) -->
      <div class="grid grid-cols-2 gap-3 w-full md:w-auto text-xs">
        <div class="bg-white/5 border border-white/10 p-3 rounded-2xl text-center">
          <span class="text-slate-400 text-[10px] block">တင်ထားသော ပစ္စည်း</span>
          <strong id="statProdCount" class="text-base text-amber-400 font-black">0</strong>
        </div>
        <div class="bg-white/5 border border-white/10 p-3 rounded-2xl text-center">
          <span class="text-slate-400 text-[10px] block">ဆိုင် Rating</span>
          <strong class="text-base text-emerald-400 font-black">⭐ 4.9</strong>
        </div>
      </div>
    </section>

    <!-- Shop's Products -->
    <section class="space-y-3">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-extrabold text-slate-800 text-base flex items-center gap-1.5">
          <i class="ph-fill ph-boxes text-orange-500"></i> ဤဆိုင်မှ ရောင်းချသော ပစ္စည်းများအားလုံး
        </h3>
        <span id="shopProdBadge" class="text-xs text-slate-400">Loading...</span>
      </div>

      <div id="shopProductGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 sm:gap-4"></div>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://zyajlsrytjvwxqtpxrqd.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5YWpsc3J5dGp2d3hxdHB4cnFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4Nzg1MjEsImV4cCI6MjEwNDQ1NDUyMX0.Tl_nrEQzt2wmCd9sZaLPr7Y5F97DKms9BCckZfI8WZ8";
    const client = supabase.createClient(SUPABASE_URL, SB_KEY);

    // URL ကနေ shop_id ဖတ်ယူခြင်း (e.g. shop.html?id=1)
    const urlParams = new URLSearchParams(window.location.search);
    const shopId = urlParams.get('id') || 1;

    async function initShop() {
      // ၁။ ဆိုင်အချက်အလက် ဆွဲယူခြင်း
      const { data: shop } = await client.from('shops').select('*').eq('id', shopId).single();
      if (shop) {
        document.getElementById('headerShopName').innerText = shop.name;
        document.getElementById('shopTitle').innerText = shop.name;
        document.getElementById('shopPhone').innerText = `📞 ဖုန်းနံပါတ်: ${shop.phone || 'မဖော်ပြထားပါ'}`;
      }

      // ၂။ ထိုဆိုင်မှ တင်ထားသော ပစ္စည်းများ ဆွဲယူခြင်း
      const { data: products } = await client
        .from('products')
        .select('*')
        .eq('shop_id', shopId)
        .order('id', { ascending: false });

      const list = products || [];
      document.getElementById('statProdCount').innerText = list.length;
      document.getElementById('shopProdBadge').innerText = `${list.length} မျိုး ရှိပါသည်`;

      const grid = document.getElementById('shopProductGrid');
      if (!list.length) {
        grid.innerHTML = '<div class="col-span-full py-16 text-center text-slate-400 text-xs">ဤဆိုင်တွင် ကုန်ပစ္စည်း မရှိသေးပါ</div>';
        return;
      }

      grid.innerHTML = list.map(p => {
        const title = p.title || p.name;
        const price = Number(p.price || p.priceMMK || 0);

        return `
          <div class="bg-white rounded-2xl border border-slate-200 p-3 flex flex-col justify-between hover:shadow-md transition">
            <div>
              <img src="${p.image || p.image_url || 'https://placehold.co/250'}" class="w-full h-36 sm:h-44 object-cover rounded-xl mb-2" />
              <h4 class="font-bold text-xs text-slate-800 line-clamp-2">${title}</h4>
              <div class="text-base font-black text-orange-600 mt-1">${price.toLocaleString()} MMK</div>
              <div class="text-[10px] text-slate-400 mt-0.5">လက်ကျန်: ${p.stock || 0} ခု</div>
            </div>
            <a href="index.html" class="mt-3 w-full bg-orange-600 hover:bg-orange-700 text-white text-center py-2 rounded-xl text-xs font-bold transition block">
              ပင်မဆိုင်တွင် ဝယ်မည်
            </a>
          </div>
        `;
      }).join('');
    }

    initShop();
  </script>
</body>
</html>
